<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratch 作品离线分析</title>
<style>
:root{
  --blue:#4c97ff;--violet:#9966ff;--pink:#cf63cf;--amber:#ffbf00;--orange:#ffab19;
  --cyan:#5cb1d6;--green:#59c059;--red:#ff6680;--ink:#1b2130;--body:#39415a;
  --muted:#6b7280;--line:#e5e8ef;--line2:#eef0f5;--bg:#f7f8fb;--card:#fff;
  --accent:#4c6fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--body);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
code{font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;font-size:.92em;
  background:#f0f2f7;padding:1px 5px;border-radius:4px;color:#2b3245}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 90px}

/* ---------- 顶栏 ---------- */
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.topbar .inner{max-width:1120px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;
  gap:14px;flex-wrap:wrap}
@media (max-width:640px){
  .topbar .inner{padding:10px 14px;gap:9px}
  .brand{font-size:14px}
  .brand small{font-size:11px}
  .btn{padding:6px 11px;font-size:12.5px}
  #offlinePill{display:none}
}
.logo{width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--blue),var(--violet));position:relative;
  box-shadow:0 3px 10px rgba(76,151,255,.3)}
.logo::after{content:"";position:absolute;inset:9px;border-radius:3px;
  border:2.5px solid #fff;border-top-color:transparent;border-right-color:transparent;transform:rotate(45deg)}
.brand{font-weight:700;font-size:16px;color:var(--ink);letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.topbar .spacer{flex:1}
.pill{font-size:12px;color:#3f7a52;background:#eafaf0;border:1px solid #bfe9cf;
  padding:4px 11px;border-radius:999px;white-space:nowrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--body);font:inherit;font-size:13.5px;
  padding:7px 14px;border-radius:9px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#c9d2e3;background:#fafbff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#3f61ee}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 上传区 ---------- */
.hero{padding:44px 0 8px;text-align:center}
.hero h1{font-size:29px;line-height:1.35;margin:0 0 10px;color:var(--ink);letter-spacing:-.02em}
@media (max-width:640px){.hero h1{font-size:22px}.hero p{font-size:13.5px}
  .wrap{padding:0 14px 70px}.rhead{padding:18px 16px}}
.hero p{margin:0 auto;max-width:600px;color:var(--muted);font-size:14.5px;text-wrap:balance}
.drop{
  margin:26px auto 0;max-width:760px;background:#fff;border:2px dashed #cfd8ea;
  border-radius:18px;padding:38px 24px;transition:.18s;cursor:pointer;position:relative;
  text-align:center;
}
.drop:hover{border-color:#a9bbdd;background:#fcfdff}
.drop.over{border-color:var(--accent);background:#f5f8ff;transform:scale(1.005)}
.drop .icon{width:52px;height:52px;margin:0 auto 14px;border-radius:14px;
  background:linear-gradient(135deg,#eef3ff,#e8ecff);display:grid;place-items:center}
.drop .icon svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.drop h2{font-size:16.5px;margin:0 0 6px;color:var(--ink)}
.drop .hint{font-size:13px;color:var(--muted)}
.drop .hint b{color:var(--body);font-weight:600}
.feat{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 0}
.feat span{font-size:12.5px;color:var(--muted);background:#fff;border:1px solid var(--line);
  padding:6px 13px;border-radius:999px}
.feat span::before{content:"✓";color:var(--green);font-weight:700;margin-right:5px}

/* ---------- 状态 ---------- */
.state{max-width:760px;margin:18px auto 0;display:none}
.state.show{display:block}
.state .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  display:flex;gap:12px;align-items:flex-start;font-size:14px}
.state.err .box{border-color:#ffd4d9;background:#fff8f9}
.spin{width:17px;height:17px;border:2.2px solid #dbe3f5;border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;flex:0 0 auto;margin-top:2px}
@keyframes sp{to{transform:rotate(360deg)}}
.state .t{font-weight:600;color:var(--ink);margin-bottom:2px}
.state .d{font-size:13px;color:var(--muted)}

/* ---------- 报告 ---------- */
#report{display:none}
#report.show{display:block}
.rhead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin:22px 0 0}
.rhead h2{margin:0 0 4px;font-size:22px;color:var(--ink);letter-spacing:-.01em;word-break:break-word}
.rhead .meta{font-size:13px;color:var(--muted)}
.rhead .acts{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
section{margin:34px 0 0}
h3.sec{font-size:17.5px;margin:0 0 14px;color:var(--ink);display:flex;align-items:center;gap:9px;
  padding-bottom:10px;border-bottom:2px solid var(--line)}
h3.sec .n{width:23px;height:23px;border-radius:7px;background:#eef2ff;color:var(--accent);
  font-size:12.5px;display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
@media (max-width:860px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.stat b{display:block;font-size:23px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (max-width:700px){
  section>table{display:block;overflow-x:auto;white-space:nowrap;
    -webkit-overflow-scrolling:touch}
  section>table::after{content:""}
  .tbl-hint{display:block}
}
.tbl-hint{display:none;font-size:12px;color:var(--muted);margin:-4px 0 8px}
.tbl-hint::before{content:"↔ ";color:var(--accent)}
th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top}
@media (max-width:700px){th,td{padding:8px 10px;font-size:13px}}
th{background:#f5f7fb;font-weight:600;font-size:12.5px;color:#414a63;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
table td:first-child,table th:first-child{padding-left:14px}
td.who{font-weight:600;color:var(--ink)}
td.dim{color:var(--muted)}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13.5px}
.bar .lb{width:82px;color:var(--body);flex:0 0 auto}
.bar .tr{flex:1;height:10px;background:#f1f3f8;border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px;min-width:5px}
.bar em{font-style:normal;font-size:12px;color:var(--muted);width:104px;text-align:right;
  flex:0 0 auto;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:#fff}
.chip.on{background:#eafaf0;border-color:#b7e6c8;color:#1a6b40;font-weight:500}
.chip.off{background:#f4f5f8;border:1px dashed #ccd2dd;color:#57606f}
ul.checks{margin:0;padding-left:0;list-style:none}
ul.checks li{position:relative;padding-left:22px;margin:7px 0;font-size:14px}
ul.checks li::before{content:"";position:absolute;left:6px;top:9px;width:6px;height:6px;
  border-radius:50%;background:var(--blue)}
.blk{margin:10px 0 0;padding:12px 14px;background:#fbfcfe;border:1px solid var(--line);
  border-radius:10px}
.blk svg{display:block;max-width:100%;height:auto}
.blk .cap{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
.blk .cap b{color:var(--ink);font-weight:600}
.blk .cap .tag{background:#eef2ff;color:#3f5fd0;border-radius:999px;padding:1px 8px;font-size:11.5px}
.blk .cap .tag.warn{background:#fff4f5;color:#b4232f}
.blk .fold{position:relative;overflow:hidden}
.blk .fold.cut{max-height:420px}
.blk .fold.cut::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;
  background:linear-gradient(rgba(251,252,254,.15) 0%,rgba(251,252,254,.95) 62%,#fbfcfe 100%);
  pointer-events:none}
.blk .more{margin-top:8px}
@media print{.blk .fold.cut{max-height:none;overflow:visible}
  .blk .fold.cut::after{display:none}.blk .more{display:none}}
.blktools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.blktools .btn{padding:5px 11px;font-size:12.5px}
.src{margin:10px 0 0}
.src summary{cursor:pointer;font-size:12.5px;color:var(--muted);user-select:none}
.src summary:hover{color:var(--accent)}
.src pre{margin:8px 0 0;background:#f7f8fb;border:1px solid var(--line);border-radius:8px;
  padding:13px 15px;overflow-x:auto;font-family:'Cascadia Code',Consolas,monospace;
  font-size:13px;line-height:1.75;color:#232936}
@media print{.blktools{display:none}}
</style>
</head>
<body>

<div class="topbar"><div class="inner">
  <div class="logo"></div>
  <div class="brand">Scratch 作品离线分析<small>解析 .sb3 · 中文讲解 · 全程本机完成</small></div>
  <div class="spacer"></div>
  <span class="pill" id="offlinePill">完全离线 · 不上传</span>
  <button class="btn" id="btnReset" style="display:none">换个作品</button>
  <button class="btn primary" id="btnPick">选择文件</button>
</div></div>

<div class="wrap">

  <div id="landing">
    <div class="hero">
      <h1>把 Scratch 作品拖进来，看懂它怎么跑</h1>
      <p>直接读取 .sb3 里的 project.json，还原积木结构，逐段翻译成中文讲解。</p>
      <p style="margin-top:6px">文件不会离开你的电脑。</p>
    </div>
    <div class="drop" id="drop">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
      </div>
      <h2>把 .sb3 文件拖到这里</h2>
      <div class="hint">或点击选择文件 · 支持任意大小的 Scratch 3.0 作品</div>
      <div class="hint" style="margin-top:4px"><b>不会上传到任何服务器</b></div>
    </div>
    <div class="feat">
      <span>零依赖，单文件网页</span>
      <span>还原原生积木图</span>
      <span>断网可用</span>
      <span>双击本地打开即可</span>
    </div>
    <div class="state" id="state">
      <div class="box">
        <div class="spin" id="stateSpin"></div>
        <div><div class="t" id="stateTitle">正在解析</div><div class="d" id="stateDesc"></div></div>
      </div>
    </div>
  </div>

  <div id="report"></div>
</div>

<input type="file" id="file" accept=".sb3" style="display:none">

  /* 下拉菜单值的官方中文（sb3 里存的是英文内部值） */
  const DROPDOWN = {
    EFFECT: { COLOR: '颜色', FISHEYE: '鱼眼', WHIRL: '旋涡', PIXELATE: '像素化',
      MOSAIC: '马赛克', BRIGHTNESS: '亮度', GHOST: '虚像' },
    STOP_OPTION: { all: '全部', 'this script': '这个脚本',

      'other scripts in stage': '该角色的其他脚本' },
    STYLE: { 'left-right': '左右翻转', "don't rotate": '不可旋转', 'all around': '任意旋转' },
    KEY_OPTION: { space: '空格', any: '任意', 'up arrow': '↑', 'down arrow': '↓',
      'left arrow': '←', 'right arrow': '→', enter: '回车' },
    CURRENTMENU: { YEAR: '年', MONTH: '月', DATE: '日', DAYOFWEEK: '星期',
      HOUR: '时', MINUTE: '分', SECOND: '秒' },
    PROPERTY: { 'x position': 'x 坐标', 'y position': 'y 坐标', direction: '方向',
      'costume #': '造型编号', 'costume name': '造型名称', size: '大小',
      'backdrop #': '背景编号', 'backdrop name': '背景名称', volume: '音量' },
    FRONT_BACK: { front: '前面', back: '后面' },
    FORWARD_BACKWARD: { forward: '前进', backward: '后退' },
    NUMBER_NAME: { number: '编号', name: '名称' },
    CLONE_OPTION: { _myself_: '自己' },
    WHENGREATERTHANMENU: { LOUDNESS: '响度', TIMER: '计时器' },
    DRAG_MODE: { draggable: '可拖动', 'not draggable': '不可拖动' },
    COLOR_PARAM: { color: '颜色', saturation: '饱和度', brightness: '亮度', transparency: '透明度' },
    OPERATOR: { abs: '绝对值', floor: '向下取整', ceiling: '向上取整', sqrt: '平方根',
      sin: 'sin', cos: 'cos', tan: 'tan', asin: 'asin', acos: 'acos',
      atan: 'atan', ln: 'ln', log: 'log', 'e ^': 'e ^', '10 ^': '10 ^' },
    VIDEO_STATE: { on: '开启', off: '关闭', 'on-flipped': '镜像开启' }
  };

  const SPECIAL_TARGET = { _mouse_: '鼠标指针', _random_: '随机位置', _edge_: '舞台边缘',
    _myself_: '自己', _stage_: '舞台' };

  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);

  /** DSL 元字符转义 */
  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/([[\](){}<>])/g, '\\$1');
  }

  function fieldOf(b, name, dflt) {
    const v = (b.fields || {})[name];
    if (Array.isArray(v) && v.length) return String(v[0]);
    return dflt === undefined ? '' : dflt;
  }

  function init() {
    ZH = typeof window !== 'undefined' ? window.__ZH_CN : null;
    SB = typeof window !== 'undefined' ? window.scratchblocks : null;
    if (!SB) { ok = false; reason = '积木渲染库未加载'; return false; }
    if (!ZH) { ok = false; reason = '中文语言包未加载'; return false; }
    try {
      SB.loadLanguages({ 'zh-cn': ZH });
      SB.appendStyles();
      ok = true;
      reason = '';
    } catch (e) {
      ok = false;
      reason = e && e.message ? e.message : String(e);
      if (typeof console !== 'undefined') console.warn('积木渲染初始化失败：', e);
    }
    return ok;
  }

  function available() { return ok; }
  function why() { return reason; }

  function makeCtx(target) {
    const vars = {}, lists = {};
    for (const [id, v] of Object.entries(target.variables || {})) {
      if (Array.isArray(v) && v.length) vars[id] = String(v[0]);
    }
    for (const [id, v] of Object.entries(target.lists || {})) {
      if (Array.isArray(v) && v.length) lists[id] = String(v[0]);
    }
    return { vars, lists };
  }

  function varName(b, name, ctx) {
    const v = (b.fields || {})[name];
    if (!Array.isArray(v) || !v.length) return '';
    const label = String(v[0]);
    const id = v.length > 1 ? String(v[1]) : '';
    if (ctx.vars[label]) return ctx.vars[label];
    if (ctx.lists[label]) return ctx.lists[label];
    if (id && ctx.vars[id]) return ctx.vars[id];
    if (id && ctx.lists[id]) return ctx.lists[id];
    return label;
  }

  function menuValue(b) {
    const f = b.fields || {};
    const keys = Object.keys(f);
    if (!keys.length) return null;
    const k = keys[0];
    const s = Array.isArray(f[k]) && f[k].length ? String(f[k][0]) : '';
    return SPECIAL_TARGET[s] || s;
  }

  function payload(rawVal, raw, ctx) {
    if (!Array.isArray(rawVal)) return { lit: rawVal === undefined ? '' : rawVal };
    const inner = rawVal.length > 1 ? rawVal[1] : null;
    if (Array.isArray(inner)) {
      const t = inner[0], v = inner[1];
      if (t === 12 || t === 13) {                 // 12 变量 / 13 列表
        for (const c of [v, inner[2]]) {
          if (typeof c !== 'string') continue;
          if (ctx.vars[c]) return { lit: ctx.vars[c] };
          if (ctx.lists[c]) return { lit: ctx.lists[c] };
        }
        return { lit: typeof v === 'string' ? v : '' };
      }
      return { lit: v === undefined ? '' : v };
    }
    if (typeof inner === 'string') {
      const blk = raw[inner];
      if (isObj(blk) && (blk.shadow || blk.opcode === 'procedures_prototype')) {
        const mv = menuValue(blk);
        return { lit: mv === null ? '' : mv };
      }
      if (isObj(blk)) return { ref: inner };
      return { lit: inner };
    }
    return { lit: inner === undefined ? '' : inner };
  }

  /* ---------- 单角色的 DSL 生成器 ---------- */
  function makeGen(target) {
    const raw = target.blocks || {};
    const ctx = makeCtx(target);
    const blocks = {};
    for (const [bid, b] of Object.entries(raw)) {
      if (!isObj(b) || b.shadow) continue;
      if (b.opcode === 'procedures_prototype') continue;
      blocks[bid] = b;
    }
    const unknown = new Set();

    function drop(fieldName, value) {
      const m = DROPDOWN[fieldName];
      const s = SPECIAL_TARGET[value] || value;
      if (m && m[s] !== undefined) return m[s];
      return s;
    }

    /* 一个参数槽。布尔槽一律自己包 < >，否则会被判成未识别积木。 */
    function slot(p, kind) {
      if (p.ref !== undefined) {
        const inner = expr(p.ref);
        if (kind === 'bool') return '<' + inner + '>';
        return '(' + inner + ')';
      }
      const s = p.lit === undefined || p.lit === null ? '' : String(p.lit);
      if (kind === 'bool') return '<' + esc(s) + '>';
      if (kind === 'dropdown') return '[' + esc(s) + ' v]';
      if (kind === 'color') {
        const hex = s.replace(/^0x/i, '').padStart(6, '0').slice(-6);
        return /^[0-9a-f]{6}$/i.test(hex) ? '[#' + hex + ']' : '[]';
      }
      if (kind === 'string') return '[' + esc(s) + ']';
      return '(' + esc(s) + ')';
    }

    function argOf(b, spec) {
      const parts = spec.split(':');
      const src = parts[0], key = parts[1], mod = parts[2];
      const kind = mod === 'b' ? 'bool' : mod === 'd' ? 'dropdown'
        : mod === 's' ? 'string' : mod === 'c' ? 'color' : 'num';

      if (src === 'f') {
        let s;
        if (key === 'VARIABLE' || key === 'LIST') s = varName(b, key, ctx);
        else s = fieldOf(b, key, '');
        s = drop(key, s);
        if (kind === 'bool') return '<' + esc(s) + '>';
        if (kind === 'dropdown') return '[' + esc(s) + ' v]';
        return '(' + esc(s) + ')';
      }

      const rawVal = (b.inputs || {})[key];
      if (rawVal === undefined || rawVal === null) {
        return kind === 'bool' ? '<>' : kind === 'dropdown' ? '[ v]'
          : kind === 'string' ? '[]' : '()';
      }
      const p = payload(rawVal, raw, ctx);
      if (p.ref === undefined && DROPDOWN[key]) p.lit = drop(key, String(p.lit));
      return slot(p, kind);
    }

    function fill(key, b) {
      const tpl = ZH.commands && ZH.commands[key];
      if (typeof tpl !== 'string') { unknown.add(key); return null; }
      const args = ARGS[key] || [];
      let n = -1;
      return tpl.replace(/%(\d)/g, () => {
        n++;
        if (n >= args.length) return '()';
        return argOf(b, args[n]);
      });
    }

    function procName(b) {
      let code = (b.mutation || {}).proccode;
      if (typeof code !== 'string') {
        const ri = (b.inputs || {}).custom_block;
        const pid = Array.isArray(ri) && ri.length > 1 ? ri[1] : null;
        const proto = pid ? raw[String(pid)] : null;
        if (proto && proto.mutation) code = proto.mutation.proccode;
      }
      return typeof code === 'string' ? code : null;
    }

    function procIds(b) {
      try {
        const s = (b.mutation || {}).argumentids;
        const arr = typeof s === 'string' ? JSON.parse(s) : null;
        return Array.isArray(arr) ? arr.map(String) : [];
      } catch (e) { return []; }
    }

    /** 自制积木：proccode 里的 %s/%n/%b 换成对应形状的槽 */
    function procText(b, withArgs) {
      const code = procName(b);
      if (!code) return '自制积木';
      const ids = procIds(b);
      let i = -1;
      return code.split(/(%[snb])/).map(p => {
        if (p !== '%s' && p !== '%n' && p !== '%b') return p ? esc(p) : '';
        i++;
        if (!withArgs) return p === '%b' ? '<>' : '()';
        const id = ids[i];
        const rawVal = id ? (b.inputs || {})[id] : undefined;
        if (rawVal === undefined) return p === '%b' ? '<>' : '()';
        return slot(payload(rawVal, raw, ctx), p === '%b' ? 'bool' : 'num');
      }).join('');
    }

    function expr(bid) {
      const b = blocks[bid];
      if (!isObj(b)) return '';
      const op = b.opcode || '';
      if (op === 'data_variable') return esc(varName(b, 'VARIABLE', ctx)) + ' :: variables';
      if (op === 'data_listcontents') return esc(varName(b, 'LIST', ctx)) + ' :: list';
      if (op === 'procedures_call') return procText(b, true);
      if (op === 'argument_reporter_string_number' || op === 'argument_reporter_boolean') {
        return esc(fieldOf(b, 'VALUE', '参数'));
      }
      const key = KEY[op];
      if (!key) { unknown.add(op); return esc(op) + ' :: extension'; }
      const t = fill(key, b);
      if (t === null) { unknown.add(key); return esc(op) + ' :: extension'; }
      return t;
    }

    /* 语句形状：c = 带内部的 C 形，cap = 到此结束 */
    const SHAPE = {
      control_repeat: 'c', control_if: 'c', control_repeat_until: 'c',
      control_forever: 'cap', control_delete_this_clone: 'cap', control_stop: 'cap'
    };

    function stmt(bid) {
      const b = blocks[bid];
      if (!isObj(b)) return '';
      const op = b.opcode || '';
      if (op === 'procedures_call') return procText(b, true);
      if (op === 'procedures_definition' || op === 'control_if_else') return '';
      const key = KEY[op];
      if (!key) { unknown.add(op); return esc(op) + ' :: extension'; }
      const t = fill(key, b);
      if (t === null) { unknown.add(key); return esc(op) + ' :: extension'; }
      return t;
    }

    const subHead = (b, key) => {
      const rv = (b.inputs || {})[key];
      if (!rv) return null;
      const inner = Array.isArray(rv) && rv.length > 1 ? rv[1] : null;
      if (typeof inner === 'string' && blocks[inner]) return inner;
      if (Array.isArray(inner) && inner.length && typeof inner[0] === 'string'
          && blocks[inner[0]]) return inner[0];
      return null;
    };

    function chain(bid, depth, out) {
      const pad = '    '.repeat(depth);
      let guard = 0;
      while (bid && blocks[bid] && guard < 5000) {
        guard++;
        const b = blocks[bid];
        const op = b.opcode || '';

        if (op === 'procedures_definition') {
          // 「定义」与积木名必须同一行，否则定义哈希带前缀、调用匹配不上
          out.push(pad + '定义 ' + procText(b, false));
          if (b.next) chain(b.next, depth + 1, out);
          return;
        }

        if (op === 'control_if_else') {
          const rv = (b.inputs || {}).CONDITION;
          const cond = rv ? slot(payload(rv, raw, ctx), 'bool') : '<>';
          out.push(pad + '如果 ' + cond + ' 那么');
          const h1 = subHead(b, 'SUBSTACK');
          if (h1) chain(h1, depth + 1, out);
          out.push(pad + '否则');
          const h2 = subHead(b, 'SUBSTACK2');
          if (h2) chain(h2, depth + 1, out);
          out.push(pad + '结束');
          bid = b.next;
          continue;
        }

        const shape = SHAPE[op];
        if (shape === 'c') {
          const line = stmt(bid);
          if (line) out.push(pad + line);
          const h1 = subHead(b, 'SUBSTACK');
          if (h1) chain(h1, depth + 1, out);
          out.push(pad + '结束');
          bid = b.next;
          continue;
        }
        if (shape === 'cap') {
          const line = stmt(bid);
          if (line) out.push(pad + line);
          return;
        }
        const line = stmt(bid);
        if (line) out.push(pad + line);
        bid = b.next;
      }
    }

    /** 全部脚本，顺序与编辑器里的位置一致 */
    function scripts() {
      const heads = Object.entries(blocks).filter(([, b]) => b.topLevel);
      heads.sort((a, b) => {
        const ya = Number(a[1].y || 0), yb = Number(b[1].y || 0);
        return ya !== yb ? ya - yb : Number(a[1].x || 0) - Number(b[1].x || 0);
      });
      return heads.map(([bid]) => {
        const lines = [];
        chain(bid, 0, lines);
        return { head: bid, code: lines.join('\n') };
      });
    }

    return { scripts, unknown };
  }

  /* ---------- 渲染：每个脚本单独解析，并预置该角色的自制积木定义 ----------
   * 单独解析是为了稳健：工程里可能有拖出来没接上的散落积木，整段解析会多出脚本，
   * 按位置切片就对不上了。每个脚本前面拼上本角色的全部「定义」，
   * 这样调用块仍然能和定义匹配、保持粉色，而不是被判成未匹配的红块。
   */
  const memo = new WeakMap();

  function build(target) {
    if (memo.has(target)) return memo.get(target);

    let r;
    try {
      const gen = makeGen(target);
      const scripts = gen.scripts().filter(s => s.code.trim());
      r = { empty: !scripts.length, scripts, unknown: [...gen.unknown] };
    } catch (e) {
      r = { empty: true, scripts: [], unknown: [], failed: e };
    }
    memo.set(target, r);
    return r;
  }

  const svgCache = new WeakMap();

  function svgOf(target, head) {
    let m = svgCache.get(target);
    if (!m) { m = new Map(); svgCache.set(target, m); }
    if (m.has(head)) return m.get(head);

    const b = build(target);
    const item = b.scripts.find(s => s.head === head);
    if (!item) { m.set(head, null); return null; }

    let out = null;
    try {
      // 先拼上本角色除自己以外的全部「定义」，保证脚本内部的调用块能匹配上；
      // 定义各占一屏，所以本脚本的屏数从 defs 之后开始算。
      const others = b.scripts
        .filter(x => x.head !== head && x.code.trimStart().startsWith('定义 '))
        .map(x => x.code);
      const prefix = others.length ? others.join('\n\n') + '\n\n' : '';
      const code = prefix + item.code;
      const doc = SB.parse(code, { languages: ['zh-cn'], style: 'scratch3' });
      let skip = 0;
      if (prefix) {
        try { skip = SB.parse(prefix, { languages: ['zh-cn'], style: 'scratch3' }).scripts.length; }
        catch (e) { skip = others.length; }
      }
      const mine = doc.scripts.slice(skip);
      if (!mine.length) throw new Error('no screen');
      doc.scripts = mine;
      out = SB.render(doc, { style: 'scratch3', languages: ['zh-cn'], scale: 0.9 });
    } catch (e) {
      out = null;
    }
    m.set(head, out);
    return out;
  }

  function prepare(target) {
    if (!ok) return null;
    const b = build(target);
    return b;
  }

  /** 单个脚本的积木图（调用块已按定义匹配好颜色） */
  function renderScript(target, headId) {
    if (!ok) return null;
    return svgOf(target, headId);
  }

  /** 该角色的整段程序（全部脚本竖排） */
  function renderAll(target) {
    if (!ok) return null;
    const b = build(target);
    if (b.empty) return null;
    try {
      const code = b.scripts.map(s => s.code).join('\n\n');
      const doc = SB.parse(code, { languages: ['zh-cn'], style: 'scratch3' });
      return SB.render(doc, { style: 'scratch3', languages: ['zh-cn'], scale: 0.9 });
    } catch (e) { return null; }
  }

  function unknownOf(target) {
    const b = build(target);
    return b && b.unknown ? b.unknown.slice() : [];
  }

  return { init, available, why, prepare, renderScript, renderAll, unknownOf, makeGen };
})();

<script>
/* ===== part1_zip.js ===== */
/* ============================================================
 * 第一部分：ZIP 解压（用浏览器原生 DecompressionStream，零依赖）
 * sb3 本质是 zip，里面是 project.json + 一堆以 MD5 命名的资源。
 * ============================================================ */
const SB3 = (() => {

  function u16(dv, o) { return dv.getUint16(o, true); }
  function u32(dv, o) { return dv.getUint32(o, true); }

  /** 找 End of Central Directory 记录：从尾部往前扫签名 0x06054b50 */
  function findEOCD(dv, len) {
    // 注释最长 65535，所以最多回扫这么远
    const start = Math.max(0, len - 22 - 65535);
    for (let i = len - 22; i >= start; i--) {
      if (u32(dv, i) === 0x06054b50) return i;
    }
    return -1;
  }

  /** 读出中央目录里的所有条目 */
  function readEntries(dv) {
    const len = dv.byteLength;
    const eocd = findEOCD(dv, len);
    if (eocd < 0) throw new Error('不是有效的 ZIP（找不到中央目录）。');

    let count = u16(dv, eocd + 10);
    let cdOffset = u32(dv, eocd + 16);
    let cdSize = u32(dv, eocd + 12);

    // ZIP64：出现 0xFFFFFFFF 说明字段溢出，去 ZIP64 EOCD 里取真值
    if (cdOffset === 0xffffffff || count === 0xffff) {
      const loc = eocd - 20;
      if (loc >= 0 && u32(dv, loc) === 0x07064b50) {
        const z64 = Number(dv.getBigUint64(loc + 8, true));
        if (z64 >= 0 && z64 + 56 <= len && u32(dv, z64) === 0x06064b50) {
          count = Number(dv.getBigUint64(z64 + 32, true));
          cdSize = Number(dv.getBigUint64(z64 + 40, true));
          cdOffset = Number(dv.getBigUint64(z64 + 48, true));
        }
      }
    }

    const entries = [];
    let p = cdOffset;
    for (let i = 0; i < count; i++) {
      if (p + 46 > len || u32(dv, p) !== 0x02014b50) break;
      const method = u16(dv, p + 10);
      const compSize = u32(dv, p + 20);
      const rawSize = u32(dv, p + 24);
      const nameLen = u16(dv, p + 28);
      const extraLen = u16(dv, p + 30);
      const commentLen = u16(dv, p + 32);
      const localOff = u32(dv, p + 42);
      const nameBytes = new Uint8Array(dv.buffer, dv.byteOffset + p + 46, nameLen);
      const name = new TextDecoder('utf-8').decode(nameBytes);
      entries.push({ name, method, compSize, rawSize, localOff });
      p += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  /** 由本地文件头定位真实数据起点 */
  function dataOffset(dv, entry) {
    const lo = entry.localOff;
    if (u32(dv, lo) !== 0x04034b50) throw new Error('ZIP 本地文件头损坏。');
    const nameLen = u16(dv, lo + 26);
    const extraLen = u16(dv, lo + 28);
    return lo + 30 + nameLen + extraLen;
  }

  /** 解压单个条目，返回 Uint8Array */
  async function readEntry(dv, entry) {
    const start = dataOffset(dv, entry);
    const size = entry.compSize;
    const raw = new Uint8Array(dv.buffer, dv.byteOffset + start, size);

    if (entry.method === 0) return raw.slice();          // 存储，未压缩

    if (entry.method !== 8) {
      throw new Error(`不支持的压缩方式（method=${entry.method}）。`);
    }
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('当前浏览器不支持 DecompressionStream，请换用新版 Chrome / Edge / Firefox / Safari。');
    }
    // deflate 在 ZIP 里是 raw 流，不带 zlib 头，所以用 deflate-raw
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([raw]).stream().pipeThrough(ds);
    const buf = await new Response(stream).arrayBuffer();
    return new Uint8Array(buf);
  }

  /** 读 project.json，返回解析后的对象 */
  async function loadProject(file) {
    const buf = await file.arrayBuffer();
    const dv = new DataView(buf);
    const entries = readEntries(dv);
    if (!entries.length) throw new Error('压缩包里没有任何文件。');

    const pjEntry = entries.find(e => e.name === 'project.json');
    if (!pjEntry) {
      throw new Error('这个压缩包里没有 project.json，不是有效的 Scratch 3.0 作品。');
    }
    if (pjEntry.rawSize > 25 * 1024 * 1024) {
      throw new Error('project.json 超过 25MB，无法分析。');
    }

    const bytes = await readEntry(dv, pjEntry);
    let text;
    try {
      text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    } catch (e) {
      throw new Error('project.json 不是合法的 UTF-8 文本。');
    }

    let project;
    try {
      project = JSON.parse(text);
    } catch (e) {
      throw new Error('project.json 内容不完整，无法解析为 JSON。');
    }
    if (!Array.isArray(project.targets) || !project.targets.length) {
      throw new Error('没有找到舞台和角色数据（targets 为空）。');
    }
    return { project, entries };
  }

  return { loadProject };
})();
