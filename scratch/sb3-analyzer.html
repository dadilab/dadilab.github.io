/* ===== part3_engine.js ===== */
/* ============================================================
 * 第三部分：解析引擎（建图 / 线性化 / 求值 / 渲染积木）
 * ============================================================ */

const Engine = (() => {
  /* 当前解析上下文：原始块表（含 shadow）、变量表、列表表 */
  let CTX = { raw: {}, vars: {}, lists: {} };

  function setContext(raw, vars, lists) {
    CTX = { raw: raw || {}, vars: vars || {}, lists: lists || {} };
  }

  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);

  function tname(t) {
    if (t.isStage) return '舞台';
    return String(t.name || '未命名角色');
  }

  /** 变量 / 列表 id -> 中文名 */
  function varName(id) {
    const v = CTX.vars[id] || CTX.lists[id];
    if (Array.isArray(v) && v.length) return String(v[0]);
    return id;
  }

  /** shadow 菜单块承载的真实取值 */
  function menuValue(bid) {
    const b = CTX.raw[bid];
    if (!isObj(b)) return null;
    const fname = MENU_BLOCKS[b.opcode];
    if (fname) {
      const v = (b.fields || {})[fname];
      if (Array.isArray(v) && v.length) {
        const s = String(v[0]);
        return SPECIAL_TARGETS[s] || s;
      }
    }
    for (const v of Object.values(b.fields || {})) {
      if (Array.isArray(v) && v.length) {
        const s = String(v[0]);
        return SPECIAL_TARGETS[s] || s;
      }
    }
    return null;
  }

  /** 真正的代码积木：排除 shadow 与 procedures_prototype */
  function realBlocks(blocks) {
    const out = {};
    for (const [bid, b] of Object.entries(blocks || {})) {
      if (!isObj(b)) continue;
      if (b.shadow) continue;
      if (b.opcode === 'procedures_prototype') continue;
      out[bid] = b;
    }
    return out;
  }

  /** inputs 里递归收集块 id */
  function flattenInputs(v, out) {
    if (typeof v === 'string') out.push(v);
    else if (Array.isArray(v)) for (const x of v) flattenInputs(x, out);
  }

  /** 从所有 topLevel 出发，可达的块 id */
  function reachable(blocks) {
    const seen = new Set();
    const walk = bid => {
      if (seen.has(bid) || !blocks[bid]) return;
      seen.add(bid);
      const b = blocks[bid];
      if (b.next) walk(b.next);
      const ids = [];
      for (const v of Object.values(b.inputs || {})) flattenInputs(v, ids);
      ids.forEach(walk);
    };
    for (const [bid, b] of Object.entries(blocks)) {
      if (isObj(b) && b.topLevel) walk(bid);
    }
    return seen;
  }

  /** 从脚本头按执行顺序拉直成 id 列表 */
  function linearize(headId, blocks) {
    const order = [], seen = new Set();
    const visit = bid => {
      if (seen.has(bid) || !blocks[bid]) return;
      seen.add(bid);
      order.push(bid);
      const b = blocks[bid];
      const ids = [];
      for (const v of Object.values(b.inputs || {})) flattenInputs(v, ids);
      ids.forEach(visit);
      if (b.next) visit(b.next);
    };
    visit(headId);
    return order;
  }

  /** 一个角色下的所有脚本，按编辑器里的位置排序 */
  function scriptsOf(target, blocks) {
    const bs = blocks || realBlocks(target.blocks || {});
    const heads = Object.entries(bs).filter(([, b]) => b.topLevel);
    heads.sort((a, b) => {
      const ya = Number(a[1].y || 0), yb = Number(b[1].y || 0);
      if (ya !== yb) return ya - yb;
      return Number(a[1].x || 0) - Number(b[1].x || 0);
    });
    return heads.map(([bid]) => ({ head: bid, ids: linearize(bid, bs) }));
  }

  function field(b, name, dflt) {
    const v = (b.fields || {})[name];
    if (Array.isArray(v) && v.length) return String(v[0]);
    return dflt === undefined ? '' : dflt;
  }

  function isNumber(s) {
    if (typeof s === 'number') return true;
    if (typeof s !== 'string' || s.trim() === '') return false;
    return !isNaN(Number(s));
  }

  /** 解析一个 input 的取值部分 */
  function describeValue(value, blocks, depth, quoted) {
    if (depth > 12) return '（嵌套过深）';
    if (typeof value === 'string') {
      if (blocks[value]) return renderBlock(value, blocks, '', depth + 1, true);
      const m = menuValue(value);
      if (m !== null) return m;
      return value;
    }
    if (Array.isArray(value)) {
      if (value.length >= 2) {
        const head = value[0], body = value[1];
        if (head === 12) {           // 变量
          const id = value.length > 2 ? String(value[2]) : '';
          if (CTX.vars[id]) return varName(id);
          if (typeof body === 'string' && CTX.vars[body]) return varName(body);
          return typeof body === 'string' ? body : '变量';
        }
        if (head === 13) {           // 列表
          const id = value.length > 2 ? String(value[2]) : '';
          if (CTX.lists[id]) return varName(id);
          if (typeof body === 'string' && CTX.lists[body]) return varName(body);
          return typeof body === 'string' ? body : '列表';
        }
        if (typeof body === 'string' && blocks[body]) {
          return renderBlock(body, blocks, '', depth + 1, true);
        }
        if (typeof body === 'string') {
          const m = menuValue(body);
          if (m !== null) return m;
        }
        if (Array.isArray(body)) return describeValue(body, blocks, depth + 1, quoted);
        const text = body === null || body === undefined ? '' : String(body);
        if (text === '') return '（空）';
        return quoted && !isNumber(text) ? `「${text}」` : text;
      }
      if (Array.isArray(value[0])) return describeValue(value[0], blocks, depth + 1, quoted);
    }
    return String(value);
  }

  function placeholders(label) {
    const keys = [], re = /\{([A-Z_0-9a-z]+)\}/g;
    let m;
    while ((m = re.exec(label))) keys.push(m[1]);
    return keys;
  }

  const DEFAULTS = {
    STEPS:'10', DEGREES:'15', SECS:'1', DURATION:'1', TIMES:'10', X:'0', Y:'0',
    DX:'10', DY:'10', NUM1:'0', NUM2:'0', NUM:'0', VALUE:'0', INDEX:'1', ITEM:'项目',
    SIZE:'100', VOLUME:'100', CHANGE:'10', LETTER:'1', MESSAGE:'你好！',
    QUESTION:'你叫什么名字？', OPERAND1:'条件', OPERAND2:'条件', OPERAND:'条件',
    CONDITION:'条件', STRING:'文本', STRING1:'文本1', STRING2:'文本2',
    KEY_OPTION:'空格', EFFECT:'颜色', COSTUME:'造型', BACKDROP:'背景',
    SOUND_MENU:'声音', VARIABLE:'变量', LIST:'列表', TO:'目标', TOWARDS:'目标',
    TOUCHINGOBJECTMENU:'角色', DISTANCETOMENU:'角色', CLONE_OPTION:'自己',
    PROPERTY:'x 坐标', OBJECT:'舞台', OPERATOR:'绝对值', STYLE:'任意旋转',
    FRONT_BACK:'前', NUMBER_NAME:'编号', WHENGREATERTHANMENU:'响度',
    CURRENTMENU:'年', STOP_OPTION:'全部', BROADCAST_INPUT:'消息',
    BROADCAST_OPTION:'消息', COLOR:'颜色', COLOR2:'颜色', PROCCODE:'自制积木'
  };

  /** 一个占位符取值 */
  function inputText(b, key, blocks, depth) {
    const raw = (b.inputs || {})[key];
    if (raw !== undefined) {
      const inner = (Array.isArray(raw) && raw.length > 1) ? raw[1] : raw;
      let txt = describeValue(inner, blocks, depth + 1, QUOTED_INPUTS.has(key));
      return SPECIAL_TARGETS[txt] || txt;
    }
    if ((b.fields || {})[key] !== undefined) {
      const v = field(b, key);
      return SPECIAL_TARGETS[v] || v;
    }
    return DEFAULTS[key] !== undefined ? DEFAULTS[key] : '…';
  }

  /** 自制积木真名：definition 自身没有 mutation，要顺 custom_block 找 prototype */
  function procName(b) {
    const fromMut = x => {
      const code = (x.mutation || {}).proccode;
      return typeof code === 'string'
        ? code.replace(/%[snb]/g, '□') : null;
    };
    const direct = fromMut(b);
    if (direct) return direct;
    for (const key of ['custom_block', 'custom_block_id']) {
      const raw = (b.inputs || {})[key];
      if (Array.isArray(raw) && raw.length > 1) {
        let pid = raw[1];
        if (Array.isArray(pid)) pid = pid[0];
        const proto = CTX.raw[String(pid)];
        if (isObj(proto)) {
          const c = fromMut(proto);
          if (c) return c;
        }
      }
    }
    return '自制积木';
  }

  function fallbackLabel(b) {
    const op = b.opcode || '';
    const prefix = op.includes('_') ? op.split('_')[0] : op;
    const ext = EXT_NAMES[prefix];
    const fields = Object.keys(b.fields || {});
    if (ext) {
      return fields.length ? `[${ext}扩展] ${op}（${field(b, fields[0])}）` : `[${ext}扩展] ${op}`;
    }
    return fields.length ? `${op}（${field(b, fields[0])}）` : op;
  }

  /** 把一个积木渲染成中文；inline=true 表示它作为参数嵌在别的积木里 */
  function renderBlock(bid, blocks, name, depth, inline) {
    depth = depth || 0;
    const b = blocks[bid];
    if (!b) return '';
    const op = b.opcode || '';

    // 菜单影子块不是语句，直接吐出它选中的值
    if (MENU_BLOCKS[op]) {
      const v = menuValue(bid);
      return v === null ? '' : v;
    }

    const entry = T[op];
    if (!entry) return fallbackLabel(b);

    if (op === 'procedures_definition' || op === 'procedures_call' || op === 'procedures_prototype') {
      return entry.label.replace('{PROCCODE}', procName(b));
    }

    let out = entry.label;
    for (const key of placeholders(entry.label)) {
      out = out.split(`{${key}}`).join(inputText(b, key, blocks, depth));
    }
    out = out.split('{_name}').join(name || '');

    if (inline && op.startsWith('operator_') && out) out = `(${out})`;
    // 兜底：清掉没替换掉的占位符
    out = out.replace(/\{[A-Za-z_0-9]+\}/g, '…');
    return out;
  }

  /** 广播消息名（收发通用） */
  function broadcastName(b, blocks) {
    if (b.opcode === 'event_whenbroadcastreceived') {
      return field(b, 'BROADCAST_OPTION', '消息');
    }
    const raw = (b.inputs || {}).BROADCAST_INPUT;
    let inner = (Array.isArray(raw) && raw.length > 1) ? raw[1] : raw;
    if (typeof inner === 'string') {
      const m = menuValue(inner);
      if (m !== null) return m;
    }
    let v = describeValue(inner, blocks, 0, true);
    v = SPECIAL_TARGETS[v] || v;
    return String(v).replace(/^「|」$/g, '') || '消息';
  }

  /** 带缩进的伪代码 */
  function renderScript(script, blocks, name) {
    const lines = [];
    const subHead = (b, key) => {
      const raw = (b.inputs || {})[key];
      if (!raw) return null;
      const inner = (Array.isArray(raw) && raw.length > 1) ? raw[1] : null;
      if (typeof inner === 'string' && blocks[inner]) return inner;
      if (Array.isArray(inner) && inner.length && typeof inner[0] === 'string'
          && blocks[inner[0]]) return inner[0];
      return null;
    };
    const emit = (bid, depth) => {
      let guard = 0;
      while (bid && blocks[bid] && guard < 2000) {
        guard++;
        const b = blocks[bid];
        const pad = '    '.repeat(depth);
        const text = renderBlock(bid, blocks, name);
        if (text && !MENU_BLOCKS[b.opcode]) lines.push(pad + text);
        const h1 = subHead(b, 'SUBSTACK');
        if (h1) emit(h1, depth + 1);
        const h2 = subHead(b, 'SUBSTACK2');
        if (h2) { lines.push(pad + '否则'); emit(h2, depth + 1); }
        bid = b.next;
      }
    };
    if (script && script.ids.length) emit(script.ids[0], 0);
    return lines.join('\n');
  }

  return {
    setContext, tname, varName, menuValue, realBlocks, flattenInputs, reachable,
    linearize, scriptsOf, field, describeValue, inputText, procName,
    renderBlock, broadcastName, renderScript
  };
})();


/* ===== part4_analysis.js ===== */
/* ============================================================
 * 第四部分：分析层（标签 / 评分 / 标题 / 步骤 / 角色画像 / 广播图）
 * ============================================================ */

const Analysis = (() => {
  function roundHalfEven(x) {
    const f = Math.floor(x);
    if (Math.abs(x - f - 0.5) < 1e-9) return f % 2 === 0 ? f : f + 1;
    return Math.round(x);
  }

  const has = (ops, prefixes) => ops.some(o => prefixes.some(p => o.startsWith(p)));

  function varNames(ids, blocks) {
    const out = [];
    for (const i of ids) {
      const b = blocks[i] || {};
      for (const key of ['VARIABLE', 'LIST']) {
        if ((b.fields || {})[key] !== undefined) {
          const v = Engine.field(b, key);
          if (v && !out.includes(v)) out.push(v);
        }
      }
    }
    return out;
  }

  function touchingTargets(ids, blocks) {
    const out = [];
    for (const i of ids) {
      const b = blocks[i] || {};
      if (b.opcode !== 'sensing_touchingobject') continue;
      const raw = (b.inputs || {}).TOUCHINGOBJECTMENU;
      const inner = (Array.isArray(raw) && raw.length > 1) ? raw[1] : raw;
      let v = Engine.describeValue(inner, blocks, 0, true);
      v = (SPECIAL_TARGETS[v] || v).replace(/^「|」$/g, '');
      if (v && !v.startsWith('_') && !out.includes(v)) out.push(v);
    }
    return out;
  }

  function tagsOf(ids, blocks) {
    const ops = ids.map(i => (blocks[i] || {}).opcode || '');
    const t = [];
    if (has(ops, ['control_repeat', 'control_forever', 'control_repeat_until'])) t.push('循环');
    if (has(ops, ['control_if', 'operator_gt', 'operator_lt', 'operator_equals',
                  'operator_and', 'operator_or', 'operator_not'])) t.push('条件判断');
    if (has(ops, ['data_'])) t.push('变量与列表');
    if (has(ops, ['event_broadcast', 'event_whenbroadcastreceived'])) t.push('广播协作');
    if (has(ops, ['sensing_'])) t.push('侦测互动');
    if (has(ops, ['control_create_clone_of', 'control_start_as_clone',
                  'control_delete_this_clone'])) t.push('克隆');
    if (has(ops, ['procedures_'])) t.push('自制积木');
    if (has(ops, ['motion_'])) t.push('角色运动');
    if (has(ops, ['looks_'])) t.push('造型与界面');
    if (has(ops, ['sound_'])) t.push('声音反馈');
    return t;
  }

  const DATA_WRITE = new Set(['data_setvariableto', 'data_changevariableby', 'data_addtolist',
    'data_replaceitemoflist', 'data_deleteoflist']);
  const TRIVIAL = new Set(['event_whenflagclicked', 'event_whenbroadcastreceived',
    'looks_nextcostume', 'looks_switchcostumeto', 'sound_play', 'sound_playuntildone',
    'control_wait']);

  /** 关键度评分：内部用 0.05 单位的整数累加，避免浮点误差 */
  function scoreOf(ids, blocks) {
    const ops = ids.map(i => (blocks[i] || {}).opcode || '');
    const cnt = ps => ops.filter(o => ps.some(p => o.startsWith(p))).length;
    let u = 0;                                        // u = 分数 × 20
    u += Math.min(ops.length, 10) * 5;                // 0.25
    u += cnt(['control_if', 'operator_gt', 'operator_lt', 'operator_equals']) * 24;  // 1.2
    u += cnt(['control_repeat', 'control_forever', 'control_repeat_until']) * 22;    // 1.1
    u += ops.filter(o => DATA_WRITE.has(o)).length * 30;                             // 1.5
    u += cnt(['event_broadcast', 'event_whenbroadcastreceived']) * 40;               // 2
    u += cnt(['sensing_touching', 'sensing_keypressed', 'sensing_mousedown',
              'sensing_answer']) * 30;                                               // 1.5
    u += cnt(['procedures_call', 'procedures_definition']) * 40;                     // 2
    u += cnt(['control_create_clone_of', 'control_start_as_clone',
              'control_delete_this_clone']) * 60;                                    // 3
    const head = ops[0] || '';
    if (head === 'event_whenbroadcastreceived' || head === 'control_start_as_clone') u += 60;
    if (['event_whenkeypressed', 'event_whenthisspriteclicked',
         'event_whenstageclicked'].includes(head)) u += 40;
    if (ops.length && ops.every(o => TRIVIAL.has(o))) u -= 40;
    if (ops.length <= 2 && cnt(['event_broadcast', 'control_', 'sensing_']) === 0) u -= 60;
    // 0.05 单位 -> 1 位小数，四舍五入（远离零），与 Python 版逐位一致
    const tenths = (u % 2 === 0) ? u / 2 : (u + (u >= 0 ? 1 : -1)) / 2;
    return Math.trunc(tenths) / 10;
  }

  /** 触发条件 */
  function triggerOf(script, blocks, name) {
    const b = blocks[script.head] || {};
    const op = b.opcode || '';
    if (op === 'control_start_as_clone') return '克隆体刚生成时';
    if (op === 'procedures_definition') return '被其他脚本调用时';
    if (T[op]) return Engine.renderBlock(script.head, blocks, name);
    return op || '脚本开始';
  }

  /** 功能标题 */
  function titleOf(script, blocks, name) {
    const b = blocks[script.head] || {};
    const op = b.opcode || '';
    const ids = script.ids;
    const ops = new Set(ids.map(i => (blocks[i] || {}).opcode || ''));
    const tvars = varNames(ids, blocks);
    const touch = touchingTargets(ids, blocks);
    const base = titleBase(b, op, ops, tvars, touch);
    if (op === 'event_whenbroadcastreceived') {
      return `${base}：${Engine.broadcastName(b, blocks)}`;
    }
    return base;
  }

  function titleBase(b, op, ops, tvars, touch) {
    if (op === 'procedures_definition') return '自制积木：' + Engine.procName(b);
    if (op === 'control_start_as_clone') return '克隆体启动与行为控制';
    if (op === 'event_whenkeypressed') return `用「${Engine.field(b, 'KEY_OPTION', '任意')}」键控制角色`;
    if (op === 'event_whenthisspriteclicked' || op === 'event_whenstageclicked') return '点击后的互动反馈';
    if (ops.has('sensing_askandwait') || ops.has('sensing_answer')) return '提问与答案处理';
    if ([...ops].some(o => o.startsWith('control_create_clone')
        || o.startsWith('control_delete_this_clone'))) return '克隆体生成与回收';
    if (touch.length && [...ops].some(o => o.startsWith('data_changevariable')
        || o.startsWith('data_setvariable'))) {
      return `与「${touch.slice(0, 2).join('、')}」互动并更新数据`;
    }
    if (ops.has('sensing_keypressed') && [...ops].some(o => o.startsWith('motion_'))) {
      return '持续检测操作并控制移动';
    }
    if (ops.has('control_if') && tvars.length) {
      return `判断并更新「${tvars.slice(0, 2).join('、')}」`;
    }
    if (op === 'event_whenflagclicked') {
      if ([...ops].some(o => o.startsWith('data_setvariable')
          || o.startsWith('data_changevariable'))) return '初始化数据并进入主循环';
      if (ops.has('looks_switchbackdropto')) return '场景切换与流程展示';
      return '点击绿旗后的开场准备';
    }
    if (op === 'event_whenbroadcastreceived') return '收到广播后的任务';
    if (ops.has('event_broadcast') && ![...ops].some(o => o.startsWith('control_'))) {
      return '发送消息并推进流程';
    }
    if ([...ops].some(o => o.startsWith('motion_'))) return '角色运动控制';
    if ([...ops].some(o => o.startsWith('looks_'))) return '动画与外观变化';
    if ([...ops].some(o => o.startsWith('sound_'))) return '声音播放与反馈';
    return '辅助程序';
  }

  /** 运行过程：优先写具体做了什么 */
  function stepsOf(ids, blocks, name) {
    const steps = [], seen = new Set();
    const add = t => { if (t && !seen.has(t)) { seen.add(t); steps.push(t); } };
    const V = (b, k) => Engine.inputText(b, k, blocks, 0);

    for (const i of ids) {
      const b = blocks[i] || {};
      const op = b.opcode || '';
      if (op.startsWith('control_repeat') || op === 'control_forever') {
        const times = op === 'control_repeat' ? ` ${V(b, 'TIMES')} 次` : '';
        add(`进入循环，重复执行内部逻辑${times}`);
      } else if (op === 'control_repeat_until') {
        add('循环检查退出条件，条件成立才离开循环');
      } else if (op === 'control_if_else') {
        add('按条件二选一，分别走两个分支');
      } else if (op.startsWith('control_if')) {
        add('判断条件，成立时才执行内部积木');
      } else if (op === 'control_wait') {
        add(`等待 ${V(b, 'DURATION')} 秒，控制节奏`);
      } else if (op === 'data_setvariableto' || op === 'data_changevariableby') {
        const v = Engine.field(b, 'VARIABLE', '变量');
        const val = V(b, 'VALUE');
        add(op === 'data_setvariableto' ? `把「${v}」设为 ${val}` : `把「${v}」增减 ${val}`);
      } else if (['data_addtolist', 'data_replaceitemoflist', 'data_deleteoflist',
                  'data_deletealloflist'].includes(op)) {
        add(`修改列表「${Engine.field(b, 'LIST', '列表')}」的内容`);
      } else if (op === 'event_broadcast' || op === 'event_broadcastandwait') {
        add(`发出「${Engine.broadcastName(b, blocks)}」广播，通知其他角色接力`);
      } else if (op === 'looks_switchbackdropto') {
        add(`把背景换成「${V(b, 'BACKDROP')}」，完成场景切换`);
      } else if (op === 'looks_nextbackdrop') {
        add('切换到下一个背景，推进场景');
      } else if (op === 'looks_switchcostumeto') {
        add(`把造型换成「${V(b, 'COSTUME')}」`);
      } else if (op === 'looks_nextcostume') {
        add('切换到下一个造型，形成动画');
      } else if (op === 'looks_show') {
        add('让角色显示出来');
      } else if (op === 'looks_hide') {
        add('把角色隐藏起来');
      } else if (op.startsWith('motion_')) {
        add(motionStep(b, op, blocks));
      } else if (op.startsWith('sound_')) {
        add('播放声音，给出听觉反馈');
      } else if (op === 'control_create_clone_of') {
        add('克隆出一个新角色实例');
      } else if (op === 'control_delete_this_clone') {
        add('删除当前克隆体，回收资源');
      } else if (op === 'sensing_touchingobject' || op === 'sensing_touchingcolor') {
        add(`检测是否碰到「${V(b, 'TOUCHINGOBJECTMENU')}」，做碰撞判定`);
      } else if (op === 'sensing_keypressed' || op === 'sensing_mousedown') {
        add('检测玩家的按键或鼠标操作，读取输入');
      } else if (op === 'sensing_askandwait' || op === 'sensing_answer') {
        add('向玩家提问，并读取玩家输入的答案');
      } else if (op === 'control_stop') {
        add('停止脚本，结束这段流程');
      } else if (op === 'procedures_call') {
        add(`调用自制积木「${Engine.procName(b)}」，复用已有逻辑`);
      }
      if (steps.length >= 5) break;
    }
    if (!steps.length) steps.push('执行该角色的基础设置');
    return steps.slice(0, 5);
  }

  function motionStep(b, op, blocks) {
    const V = k => Engine.inputText(b, k, blocks, 0);
    if (op === 'motion_gotoxy') return `把角色移到坐标 (${V('X')}, ${V('Y')})`;
    if (op === 'motion_setx') return `把横坐标设为 ${V('X')}`;
    if (op === 'motion_sety') return `把纵坐标设为 ${V('Y')}`;
    if (op === 'motion_movesteps') return `沿当前朝向移动 ${V('STEPS')} 步`;
    if (op === 'motion_turnleft') return `向左旋转 ${V('DEGREES')} 度`;
    if (op === 'motion_turnright') return `向右旋转 ${V('DEGREES')} 度`;
    if (op === 'motion_pointindirection') return `把朝向设为 ${V('DIRECTION')} 度`;
    return '调整角色的位置或朝向';
  }

  function teachingTip(t) {
    if (t.includes('广播协作')) return '重点观察广播如何把不同角色的程序连接成一条完整流程。';
    if (t.includes('克隆')) return '重点理解克隆体与原角色的区别：每个克隆体都有自己独立的变量和位置。';
    if (t.includes('变量与列表')) return '重点理解数据在运行过程中如何被读取、更新，并影响后面的结果。';
    if (t.includes('条件判断')) return '重点理解条件成立与不成立时，程序分别走哪条分支。';
    if (t.includes('循环')) return '重点观察循环体被执行了多少次，以及什么时候退出循环。';
    if (t.includes('自制积木')) return '重点理解自制积木如何把重复逻辑封装起来，被多处调用。';
    return '先说明触发条件，再沿着流程观察角色发生了什么变化。';
  }

  function debugTip(t) {
    if (t.includes('广播协作')) return '若没有反应，先检查广播名称是否完全一致，以及接收脚本是否挂在正确的角色上。';
    if (t.includes('克隆')) return '若克隆体数量异常或卡顿，检查创建克隆的条件与删除克隆体的时机。';
    if (t.includes('变量与列表')) return '若结果不对，先把相关变量显示在舞台上，逐步确认它每一步的值。';
    if (t.includes('侦测互动')) return '若碰撞或按键没反应，检查检测对象名称、颜色取值是否与实际一致。';
    if (t.includes('循环')) return '若程序卡住不动，检查循环的退出条件是否可能永远不成立。';
    if (t.includes('自制积木')) return '若运行结果异常，检查调用时传入的参数顺序是否正确。';
    return '若程序没有运行，先确认最上面的触发条件是否真的发生了。';
  }

  /** 消息名 -> 接收角色列表 */
  function broadcastMap(project) {
    const m = new Map();
    for (const t of project.targets) {
      const name = Engine.tname(t);
      for (const b of Object.values(t.blocks || {})) {
        if (b && b.opcode === 'event_whenbroadcastreceived') {
          const msg = Engine.field(b, 'BROADCAST_OPTION', '消息');
          if (!m.has(msg)) m.set(msg, []);
          const arr = m.get(msg);
          if (!arr.includes(name)) arr.push(name);
        }
      }
    }
    return m;
  }

  /** 角色画像 */
  function profile(target, index, project, annotations) {
    const raw = target.blocks || {};
    Engine.setContext(raw, target.variables || {}, target.lists || {});
    const blocks = Engine.realBlocks(raw);
    const ids = Object.keys(blocks);
    const ops = ids.map(i => blocks[i].opcode || '');
    const name = Engine.tname(target);
    const n = ps => has(ops, ps);

    const varsUsed = varNames(ids, blocks);
    const touch = touchingTargets(ids, blocks);
    const incoming = dedup(Object.values(blocks)
      .filter(b => b.opcode === 'event_whenbroadcastreceived')
      .map(b => Engine.field(b, 'BROADCAST_OPTION', ''))
      .filter(x => x && x !== '消息'));
    const outgoing = dedup(Object.values(blocks)
      .filter(b => ['event_broadcast', 'event_broadcastandwait'].includes(b.opcode))
      .map(b => Engine.broadcastName(b, blocks))
      .filter(x => x && x !== '消息'));

    // 协作对象
    const collab = [];
    const mineOut = new Set(outgoing), mineIn = new Set(incoming);
    for (const other of project.targets) {
      const oname = Engine.tname(other);
      if (oname === name) continue;
      Engine.setContext(other.blocks || {}, other.variables || {}, other.lists || {});
      const ob = Engine.realBlocks(other.blocks || {});
      const oIn = new Set(Object.values(ob)
        .filter(b => b.opcode === 'event_whenbroadcastreceived')
        .map(b => Engine.field(b, 'BROADCAST_OPTION', '')));
      const oOut = new Set(Object.values(ob)
        .filter(b => ['event_broadcast', 'event_broadcastandwait'].includes(b.opcode))
        .map(b => Engine.broadcastName(b, ob)));
      let linked = touch.includes(oname);
      if (!linked) for (const m of mineOut) if (oIn.has(m)) { linked = true; break; }
      if (!linked) for (const m of oOut) if (mineIn.has(m)) { linked = true; break; }
      if (linked) collab.push(oname);
    }
    Engine.setContext(raw, target.variables || {}, target.lists || {});

    // 身份判定
    const count = ps => ops.filter(o => ps.some(p => o.startsWith(p))).length;
    const gPlay = count(['sensing_keypressed', 'sensing_mousedown']) * 4
      + count(['motion_']) * 0.5 + count(['sensing_touching']) * 3;
    const gFlow = (incoming.length + outgoing.length) * 2
      + count(['looks_switchbackdropto', 'looks_nextbackdrop']) * 2
      + count(['control_stop']) * 2;
    const gRule = ops.filter(o => ['control_if', 'operator_gt', 'operator_lt',
        'operator_equals'].includes(o)).length
      + ops.filter(o => ['data_setvariableto', 'data_changevariableby'].includes(o)).length * 1.5
      + count(['sensing_touching']) * 2;
    const gClone = count(['control_create_clone_of']) * 4
      + count(['control_start_as_clone']) * 4 + count(['control_delete_this_clone']) * 3;

    let identity;
    if (target.isStage) identity = '舞台与流程管理';
    else if (!ids.length) identity = '暂无程序的素材角色';
    else {
      const cand = [['玩家操控角色', gPlay], ['流程与消息管理', gFlow],
                    ['规则判断角色', gRule], ['克隆管理角色', gClone]]
        .sort((a, b) => b[1] - a[1]);
      if (cand[0][1] >= 4) identity = cand[0][0];
      else if (ops.includes('event_whenthisspriteclicked') && outgoing.length) identity = '互动按钮角色';
      else if (ops.includes('sensing_askandwait') || ops.includes('sensing_answer')) identity = '问答交互角色';
      else if (ops.some(o => o.startsWith('control_create_clone'))) identity = '克隆管理角色';
      else if (n(['motion_']) && n(['looks_'])) identity = '动画与位移角色';
      else if (n(['looks_', 'sound_']) && !n(['motion_', 'data_', 'sensing_'])) identity = '动画与反馈角色';
      else if (incoming.length || outgoing.length) identity = '流程与消息管理';
      else identity = '界面展示角色';
    }

    // 职责
    const resp = [];
    if (target.isStage && n(['looks_switchbackdropto', 'looks_nextbackdrop'])) resp.push('管理背景切换和场景状态');
    if (n(['sensing_keypressed', 'sensing_mousedown']) && n(['motion_'])) resp.push('响应操作并控制角色移动');
    if (touch.length) resp.push(`检测与「${touch.slice(0, 3).join('、')}」的互动`);
    if (varsUsed.length) resp.push(`读取或更新「${varsUsed.slice(0, 4).join('、')}」数据`);
    if (incoming.length || outgoing.length) resp.push('通过广播与其他角色协作并推进流程');
    if (n(['control_create_clone_of', 'control_start_as_clone', 'control_delete_this_clone'])) {
      resp.push('创建、控制或回收克隆体');
    }
    if (!resp.length) {
      if (n(['looks_'])) resp.push('负责造型、显示状态和画面反馈');
      else if (n(['sound_'])) resp.push('提供声音反馈');
      else resp.push(ids.length ? '执行该角色已有的辅助程序' : '作为作品中的画面或素材元素');
    }

    const knowledge = [];
    for (const a of annotations) {
      if (a.targetIndex !== index) continue;
      for (const t of a.tags) if (!knowledge.includes(t)) knowledge.push(t);
    }

    return {
      targetIndex: index, name, sourceName: String(target.name || ''),
      isStage: !!target.isStage,
      blocks: ids.length,
      scripts: Engine.scriptsOf(target, blocks).length,
      costumes: (target.costumes || []).length,
      sounds: (target.sounds || []).length,
      variables: Object.keys(target.variables || {}).length,
      lists: Object.keys(target.lists || {}).length,
      identity,
      summary: resp.slice(0, 3).join('；') + '。',
      responsibilities: resp.slice(0, 5),
      dataNames: varsUsed.slice(0, 8),
      incomingMessages: incoming, outgoingMessages: outgoing,
      collaborators: collab, knowledge
    };
  }

  function dedup(a) {
    const out = [];
    for (const x of a) if (!out.includes(x)) out.push(x);
    return out;
  }

  return { tagsOf, scoreOf, triggerOf, titleOf, stepsOf, teachingTip, debugTip,
           broadcastMap, profile, varNames, touchingTargets, dedup };
})();


/* ===== part5_build.js ===== */
/* ============================================================
 * 第五部分：把结构变成完整分析结果（编排层）
 * ============================================================ */

function buildReport(project, fileMeta) {
  const targets = project.targets || [];
  const bmap = Analysis.broadcastMap(project);
  const annotations = [];

  for (let ti = 0; ti < targets.length; ti++) {
    const t = targets[ti];
    const raw = t.blocks || {};
    Engine.setContext(raw, t.variables || {}, t.lists || {});
    const blocks = Engine.realBlocks(raw);
    const scripts = Engine.scriptsOf(t, blocks);
    const name = Engine.tname(t);

    for (let order = 0; order < scripts.length; order++) {
      const sc = scripts[order];
      const tags = Analysis.tagsOf(sc.ids, blocks);
      annotations.push({
        targetIndex: ti,
        blockId: sc.head,
        targetName: name,
        title: Analysis.titleOf(sc, blocks, name),
        trigger: Analysis.triggerOf(sc, blocks, name),
        steps: Analysis.stepsOf(sc.ids, blocks, name),
        tags,
        blockCount: sc.ids.filter(i => blocks[i]).length,
        score: Analysis.scoreOf(sc.ids, blocks),
        isKey: false,
        teachingTip: Analysis.teachingTip(tags),
        debugTip: Analysis.debugTip(tags),
        source: Engine.renderScript(sc, blocks, name),
        order
      });
    }
  }

  // 关键脚本按相对分位判定，避免"几乎全是关键"
  const scores = annotations.map(a => a.score).sort((a, b) => b - a);
  const cutoff = scores.length ? Math.max(10, scores[Math.min(scores.length - 1,
    Math.floor(scores.length * 0.4))]) : 10;
  for (const a of annotations) a.isKey = a.score >= cutoff;

  const roles = targets.map((t, i) => Analysis.profile(t, i, project, annotations));

  // 分类统计
  const catCount = {};
  let unsupported = 0, orphan = 0;
  for (const t of targets) {
    const raw = t.blocks || {};
    const blocks = Engine.realBlocks(raw);
    const reach = Engine.reachable(raw);
    orphan += Object.keys(blocks).filter(bid => !reach.has(bid)).length;
    for (const b of Object.values(blocks)) {
      const op = b.opcode || '';
      if (!T[op]) unsupported++;
      let hit = false;
      for (const c of CATEGORIES) {
        if (c.prefixes.some(p => op.startsWith(p))) { catCount[c.name] = (catCount[c.name] || 0) + 1; hit = true; break; }
      }
      if (!hit) catCount['其他'] = (catCount['其他'] || 0) + 1;
    }
  }
  const categories = CATEGORIES
    .map(c => ({ key: c.key, name: c.name, color: c.color, count: catCount[c.name] || 0 }))
    .filter(c => c.count > 0);
  if (catCount['其他']) categories.push({ key: 'other', name: '其他', color: '#7f8c9d', count: catCount['其他'] });

  // 能力维度
  const allOps = new Set();
  for (const t of targets) {
    for (const b of Object.values(Engine.realBlocks(t.blocks || {}))) allOps.add(b.opcode || '');
  }
  const hasOp = ps => [...ps].some(p => [...allOps].some(o => o.startsWith(p)));
  const knowledge = [
    ['事件启动', ['event_when'], '#ffbf00'],
    ['循环控制', ['control_repeat', 'control_forever'], '#ffab19'],
    ['条件判断', ['control_if', 'operator_gt', 'operator_lt', 'operator_equals'], '#ff9f25'],
    ['变量记录', ['data_setvariableto', 'data_changevariableby', 'data_variable'], '#ff8c1a'],
    ['列表处理', ['data_list', 'data_addtolist', 'data_itemoflist'], '#e8873b'],
    ['广播协作', ['event_broadcast', 'event_whenbroadcastreceived'], '#f4bb16'],
    ['克隆角色', ['control_create_clone_of', 'control_start_as_clone'], '#f09b26'],
    ['自制积木', ['procedures_'], '#ff6680'],
    ['互动侦测', ['sensing_'], '#5cb1d6']
  ].map(([name, ps, color]) => ({ name, used: hasOp(ps), color }));

  const overview = {
    sprites: targets.filter(t => !t.isStage).length,
    blocks: roles.reduce((s, r) => s + r.blocks, 0),
    scripts: roles.reduce((s, r) => s + r.scripts, 0),
    costumes: targets.reduce((s, t) => s + (t.costumes || []).length, 0),
    sounds: targets.reduce((s, t) => s + (t.sounds || []).length, 0),
    variables: targets.reduce((s, t) => s + Object.keys(t.variables || {}).length, 0),
    lists: targets.reduce((s, t) => s + Object.keys(t.lists || {}).length, 0),
    broadcasts: bmap.size,
    customBlocks: targets.reduce((s, t) => s + Object.values(t.blocks || {})
      .filter(b => b && b.opcode === 'procedures_definition').length, 0),
    comments: targets.reduce((s, t) => s + Object.keys(t.comments || {}).length, 0),
    keyScripts: annotations.filter(a => a.isKey).length,
    orphanBlocks: orphan,
    unsupported,
    extensions: project.extensions || []
  };

  overview.checks = buildChecks(overview, bmap);

  return {
    fileName: fileMeta.fileName,
    fileSize: fileMeta.fileSize,
    projectName: (fileMeta.fileName || '').replace(/\.sb3$/i, '').trim() || 'Scratch 作品',
    semver: (project.meta || {}).semver || '',
    vm: (project.meta || {}).vm || '',
    project, roles, categories, annotations, knowledge, overview,
    broadcasts: [...bmap.entries()].map(([msg, recv]) => ({ msg, recv }))
  };
}

function buildChecks(ov, bmap) {
  const out = ['作品文件完整，角色、程序和素材均可正常整理。'];
  if (ov.comments) out.push(`作品中包含 ${ov.comments} 条作者注释，可在 Scratch 编辑器里继续查看。`);
  if (ov.orphanBlocks) out.push(`发现 ${ov.orphanBlocks} 块未连接积木，它们不会随主程序运行，可能是调试残留或临时素材。`);
  if (ov.unsupported) out.push(`作品含 ${ov.unsupported} 块扩展或非常规积木，报告对其说明较简略，实际效果需在对应扩展环境中确认。`);
  if (ov.extensions.length) {
    out.push(`作品使用了 ${ov.extensions.map(e => EXT_NAMES[e] || e).join('、')} 扩展，运行前请确认平台已加载同类扩展。`);
  }
  if (ov.blocks > 700) out.push(`作品积木较多（${ov.blocks} 块），报告篇幅较长，建议按角色分节阅读。`);
  if (!bmap.size) {
    out.push('作品没有使用广播，各角色程序相互独立，不存在跨角色消息协作。');
  } else {
    const empty = [...bmap.entries()].filter(([, r]) => !r.length).map(([m]) => m);
    if (empty.length) out.push(`有 ${empty.length} 条广播没有任何角色接收（${empty.slice(0, 5).join('、')}），可能是改版后遗留的消息。`);
    const big = [...bmap.entries()].sort((a, b) => b[1].length - a[1].length)[0];
    if (big && big[1].length >= 3) {
      out.push(`「${big[0]}」是最繁忙的消息，被 ${big[1].length} 个角色同时接收，是全作品的流程枢纽。`);
    }
  }
  return out;
}


/* ===== part6_ui.js ===== */
/* ============================================================
 * 第六部分：DOM 渲染 + 交互
 * ============================================================ */

const UI = (() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function kb(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }

  let LAST = null;

  function setState(title, desc, isErr) {
    const st = $('#state');
    st.classList.add('show');
    st.classList.toggle('err', !!isErr);
    $('#stateTitle').textContent = title;
    $('#stateDesc').textContent = desc || '';
    $('#stateSpin').style.display = isErr ? 'none' : '';
  }
  function clearState() { $('#state').classList.remove('show'); }

  /* ---------- 把讲解卡片里的占位换成真实积木图 ---------- */
  function paintBlocks(r) {
    const holders = document.querySelectorAll('#report .blk[data-blk]');
    if (!holders.length) return;
    if (!Blocks.available()) {
      // 渲染不可用时降级：把占位去掉，等宽源码仍然可看
      holders.forEach(el => el.remove());
      return;
    }
    const targets = (r.project && r.project.targets) || [];
    let shown = 0;
    holders.forEach(el => {
      const raw = el.getAttribute('data-blk') || '';
      const cut = raw.indexOf(':');
      const ti = Number(raw.slice(0, cut));
      const headId = raw.slice(cut + 1);
      const t = targets[ti];
      if (!t) { el.remove(); return; }
      const svg = Blocks.renderScript(t, headId);
      if (!svg) { el.remove(); return; }
      const an = r.annotations.find(a => a.targetIndex === ti && a.blockId === headId);
      const cap = document.createElement('div');
      cap.className = 'cap';
      const nBlocks = an ? an.blockCount : 0;
      cap.innerHTML = `<b>积木图</b><span>${nBlocks} 块</span>` +
        (an && an.tags.length ? `<span class="tag">${esc(an.tags.join(' · '))}</span>` : '');
      el.appendChild(cap);
      const h = parseFloat(svg.getAttribute('height')) || 0;
      const w = parseFloat(svg.getAttribute('width')) || 0;
      if (h > 640 || w > 860) {
        // 太长的脚本先折起来，避免整页被几张图撑到几万像素
        const fold = document.createElement('div');
        fold.className = 'fold cut';
        fold.appendChild(svg);
        el.appendChild(fold);
        const btn = document.createElement('button');
        btn.className = 'btn more';
        const full = `展开全部积木（${Math.round(w)} × ${Math.round(h)}）`;
        btn.textContent = full;
        btn.onclick = () => {
          const cut = fold.classList.toggle('cut');
          btn.textContent = cut ? full : '收起积木图';
        };
        el.appendChild(btn);
      } else {
        el.appendChild(svg);
      }
      shown++;
    });
    // 未知积木提示：全作品汇总一次
    const unknownAll = [];
    targets.forEach(t => { Blocks.unknownOf(t).forEach(k => { if (!unknownAll.includes(k)) unknownAll.push(k); }); });
    if (unknownAll.length) {
      const note = document.createElement('div');
      note.style.cssText = 'font-size:12.5px;color:var(--muted);margin-top:8px';
      note.textContent = '以下积木不在内置词典中，图中以扩展色显示：' + unknownAll.slice(0, 8).join('、');
      const host = document.querySelector('#report');
      if (host) host.appendChild(note);
    }
    return shown;
  }

  function render(r) {
    LAST = r;
    const ov = r.overview;
    const h = [];

    /* ---- 头部 ---- */
    h.push(`<div class="rhead">
      <h2>${esc(r.projectName)} · 程序分析</h2>
      <div class="meta">文件 <code>${esc(r.fileName)}</code>（${kb(r.fileSize)}）
        ｜ Scratch ${esc(r.semver || '3.0.0')} ｜ vm ${esc(r.vm || '-')}</div>
      <div class="acts">
        <button class="btn" id="btnMd">导出 Markdown</button>
        <button class="btn" id="btnJson">导出 JSON</button>
        <button class="btn" id="btnPrint">打印 / 存 PDF</button>
      </div>
    </div>`);

    /* ---- 总览 ---- */
    const stats = [
      ['角色', ov.sprites], ['积木总数', ov.blocks], ['脚本段数', ov.scripts],
      ['造型', ov.costumes], ['声音', ov.sounds], ['变量', ov.variables],
      ['列表', ov.lists], ['广播消息', ov.broadcasts],
      ['自制积木', ov.customBlocks], ['关键脚本', ov.keyScripts]
    ];
    h.push(`<section><h3 class="sec"><span class="n">1</span>总览</h3>
      <div class="grid">${stats.map(([k, v]) =>
        `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('')}</div></section>`);

    /* ---- 积木构成 + 能力维度 ---- */
    if (r.categories.length) {
      const total = r.categories.reduce((s, c) => s + c.count, 0) || 1;
      const bars = r.categories.slice().sort((a, b) => b.count - a.count).map(c => {
        const pct = c.count / total * 100;
        return `<div class="bar"><span class="lb">${esc(c.name)}</span>
          <span class="tr"><i style="width:${Math.max(pct, 1.2)}%;background:${c.color}"></i></span>
          <em>${c.count} 块 · ${pct.toFixed(0)}%</em></div>`;
      }).join('');
      h.push(`<section><h3 class="sec"><span class="n">2</span>积木构成</h3>
        <div class="card">${bars}</div>
        <div class="chips" style="margin-top:14px">${r.knowledge.map(k =>
          `<span class="chip ${k.used ? 'on' : 'off'}">${k.used ? '✓' : '—'} ${esc(k.name)}</span>`
        ).join('')}</div></section>`);
    }

    /* ---- 体检 ---- */
    h.push(`<section><h3 class="sec"><span class="n">3</span>体检结论</h3>
      <div class="card"><ul class="checks">${ov.checks.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div></section>`);

    /* ---- 广播协作图 ---- */
    if (r.broadcasts.length) {
      const rows = r.broadcasts.slice().sort((a, b) => b.recv.length - a.recv.length)
        .map(({ msg, recv }) => `<tr><td class="who">${esc(msg)}</td>
          <td class="${recv.length ? '' : 'dim'}">${recv.length ? esc(recv.join('、')) : '无人接收'}</td>
          <td class="num">${recv.length}</td></tr>`).join('');
      h.push(`<section><h3 class="sec"><span class="n">4</span>广播协作图</h3>
        <table><thead><tr><th>消息</th><th>接收角色</th><th class="num">接收数</th></tr></thead>
        <tbody>${rows}</tbody></table></section>`);
    }

    /* ---- 角色职责表 ---- */
    const roleRows = r.roles.map((ro, i) => `<tr>
      <td class="num">${i}</td><td class="who">${esc(ro.name)}</td>
      <td>${esc(ro.identity)}</td>
      <td class="num">${ro.blocks}</td><td class="num">${ro.scripts}</td>
      <td class="${ro.incomingMessages.length ? '' : 'dim'}">${esc(ro.incomingMessages.slice(0, 3).join('、') || '—')}</td>
      <td class="${ro.outgoingMessages.length ? '' : 'dim'}">${esc(ro.outgoingMessages.slice(0, 3).join('、') || '—')}</td>
    </tr>`).join('');
    h.push(`<section><h3 class="sec"><span class="n">5</span>角色职责</h3>
      <table><thead><tr><th class="num">#</th><th>角色</th><th>定位</th>
      <th class="num">积木</th><th class="num">脚本</th><th>收消息</th><th>发消息</th></tr></thead>
      <tbody>${roleRows}</tbody></table></section>`);

    /* ---- 角色详解 ---- */
    const secN = r.broadcasts.length ? 6 : 5;
    h.push(`<section><h3 class="sec"><span class="n">${secN}</span>角色详解与中文讲解</h3>`);

    r.roles.forEach((ro, i) => {
      const anns = r.annotations.filter(a => a.targetIndex === i)
        .sort((a, b) => b.score - a.score);
      const kv = [];
      kv.push(['积木 / 脚本', `${ro.blocks} 块 · ${ro.scripts} 段`]);
      kv.push(['造型 / 声音', `${ro.costumes} 个 · ${ro.sounds} 个`]);
      if (ro.dataNames.length) kv.push(['涉及数据', ro.dataNames.join('、')]);
      if (ro.incomingMessages.length) kv.push(['接收广播', ro.incomingMessages.join('、')]);
      if (ro.outgoingMessages.length) kv.push(['发送广播', ro.outgoingMessages.join('、')]);
      if (ro.collaborators.length) kv.push(['协作对象', ro.collaborators.slice(0, 8).join('、')]);
      if (ro.knowledge.length) kv.push(['知识点', ro.knowledge.join('、')]);

      h.push(`<div class="card" style="margin-top:14px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">
          <span style="font-weight:700;font-size:16px;color:var(--ink)">${i}. ${esc(ro.name)}</span>
          <span style="font-size:12px;padding:2px 10px;border-radius:999px;
            ${ro.isStage ? 'background:#fff4e6;color:#a36100;border:1px solid #ffd9a8'
                         : 'background:#eef4ff;color:#2f62d8;border:1px solid #d5e2ff'}">${esc(ro.identity)}</span>
        </div>
        <div style="font-size:13.5px;color:var(--muted);margin-bottom:10px">${esc(ro.summary)}</div>
        <table style="font-size:13px">${kv.map(([k, v]) =>
          `<tr><td style="width:96px;color:var(--muted);background:#fafbfd">${k}</td><td>${esc(v)}</td></tr>`
        ).join('')}</table>`);

      if (!anns.length) {
        h.push(`<div style="font-size:13px;color:var(--muted);margin-top:12px">该角色没有独立脚本，主要作为画面素材使用。</div>`);
      }

      anns.forEach((an, j) => {
        h.push(`<div style="border:1px solid var(--line);border-left:3px solid
            ${an.isKey ? 'var(--amber)' : 'var(--blue)'};border-radius:10px;padding:14px 16px;margin-top:14px">
          <div style="font-weight:600;color:var(--ink);font-size:14px;margin-bottom:6px">
            ${i}.${j + 1} ${esc(an.title)}${an.isKey ? ' <span style="color:#b8860b">⭐ 关键</span>' : ''}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">
            触发：${esc(an.trigger)} ｜ ${an.blockCount} 块积木 ｜ 评分 ${an.score}
            ${an.tags.length ? ' ｜ 能力：' + esc(an.tags.join('、')) : ''}</div>
          <ol style="margin:0 0 10px;padding-left:22px;font-size:13.5px">
            ${an.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
          <div style="font-size:12.5px;background:#f7f8fc;border-radius:8px;padding:9px 12px;margin-bottom:4px">
            <b style="color:var(--ink)">教学重点</b>：${esc(an.teachingTip)}<br>
            <b style="color:var(--ink)">调试提醒</b>：${esc(an.debugTip)}</div>
          <div class="blk" data-blk="${i}:${esc(an.blockId)}"></div>
          <details class="src"><summary>查看等宽源码</summary><pre>${esc(an.source)}</pre></details>
        </div>`);
      });
      h.push('</div>');
    });
    h.push('</section>');

    h.push(`<div style="margin-top:44px;padding-top:18px;border-top:1px solid var(--line);
      font-size:12.5px;color:var(--muted)">
      本报告由这个网页在本地直接解析 .sb3 生成：解压 → 读取 project.json → 重建积木图 →
      逐块翻译 → 绘制原生积木 → 模板化讲解。积木图形由内嵌的 scratchblocks 与简体中文语言包在本地绘制，文件从未离开你的电脑，页面也不发起任何网络请求。</div>`);

    $('#report').innerHTML = h.join('');
    paintBlocks(r);
    $('#report').classList.add('show');
    $('#landing').style.display = 'none';
    $('#btnReset').style.display = '';
    $('#btnPick').textContent = '重新选择';

    $('#btnMd').onclick = () => download(r.projectName + '.分析.md', toMarkdown(r), 'text/markdown');
    $('#btnJson').onclick = () => download(r.projectName + '.分析.json',
      JSON.stringify({ ...r, project: undefined }, null, 2), 'application/json');
    $('#btnPrint').onclick = () => window.print();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function download(name, text, mime) {
    const blob = new Blob([text], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /* ---------- Markdown 导出 ---------- */
  function toMarkdown(r) {
    const L = [], a = s => L.push(s);
    const ov = r.overview;
    a(`# ${r.projectName} · 程序分析报告\n`);
    a(`> 文件：\`${r.fileName}\`（${kb(r.fileSize)}）｜Scratch ${r.semver || '3.0.0'}｜vm ${r.vm || '-'}\n`);
    a('## 一、总览\n');
    a('| 项目 | 数量 | 项目 | 数量 |');
    a('|---|---:|---|---:|');
    a(`| 角色 | ${ov.sprites} | 积木总数 | ${ov.blocks} |`);
    a(`| 脚本段数 | ${ov.scripts} | 造型 | ${ov.costumes} |`);
    a(`| 声音 | ${ov.sounds} | 变量 | ${ov.variables} |`);
    a(`| 列表 | ${ov.lists} | 广播消息 | ${ov.broadcasts} |`);
    a(`| 自制积木 | ${ov.customBlocks} | 关键脚本 | ${ov.keyScripts} |\n`);

    if (r.categories.length) {
      const total = r.categories.reduce((s, c) => s + c.count, 0);
      a('**积木构成**\n');
      r.categories.slice().sort((x, y) => y.count - x.count).forEach(c => {
        const pct = c.count / total * 100;
        a(`- ${c.name}：${c.count} 块（${pct.toFixed(0)}%）${'█'.repeat(Math.max(1, Math.round(pct / 4)))}`);
      });
      a('');
    }
    a('**能力维度**\n');
    a(r.knowledge.map(k => (k.used ? '✅ ' : '⬜ ') + k.name).join('　') + '\n');

    a('## 二、体检结论\n');
    ov.checks.forEach(c => a(`- ${c}`));
    a('');

    if (r.broadcasts.length) {
      a('## 三、广播协作图\n');
      a('| 消息 | 接收角色 |');
      a('|---|---|');
      r.broadcasts.slice().sort((x, y) => y.recv.length - x.recv.length).forEach(({ msg, recv }) => {
        a(`| ${msg} | ${recv.length ? recv.join('、') : '（无人接收）'} |`);
      });
      a('');
    }

    a('## 四、角色职责\n');
    a('| # | 角色 | 定位 | 积木 | 脚本 | 收消息 | 发消息 |');
    a('|---|---|---|---:|---:|---|---|');
    r.roles.forEach((ro, i) => {
      a(`| ${i} | ${ro.name} | ${ro.identity} | ${ro.blocks} | ${ro.scripts} | ` +
        `${ro.incomingMessages.slice(0, 3).join('、') || '—'} | ${ro.outgoingMessages.slice(0, 3).join('、') || '—'} |`);
    });
    a('');

    a('## 五、角色详解与中文讲解\n');
    r.roles.forEach((ro, i) => {
      a(`### ${i}. ${ro.name}${ro.isStage ? '（舞台）' : ''} — ${ro.identity}\n`);
      a(`- **职责**：${ro.summary}`);
      if (ro.dataNames.length) a(`- **涉及数据**：${ro.dataNames.join('、')}`);
      if (ro.incomingMessages.length) a(`- **接收广播**：${ro.incomingMessages.join('、')}`);
      if (ro.outgoingMessages.length) a(`- **发送广播**：${ro.outgoingMessages.join('、')}`);
      if (ro.collaborators.length) a(`- **协作对象**：${ro.collaborators.slice(0, 6).join('、')}`);
      if (ro.knowledge.length) a(`- **知识点**：${ro.knowledge.join('、')}`);
      a('');

      const anns = r.annotations.filter(x => x.targetIndex === i).sort((x, y) => y.score - x.score);
      if (!anns.length) { a('_该角色没有独立脚本，主要作为画面素材使用。_\n'); return; }
      anns.forEach((an, j) => {
        a(`#### ${i}.${j + 1} ${an.title}${an.isKey ? ' ⭐关键' : ''}\n`);
        a(`- **触发**：${an.trigger}`);
        a(`- **规模**：${an.blockCount} 块有效积木｜关键度评分 ${an.score}`);
        if (an.tags.length) a(`- **涉及能力**：${an.tags.join('、')}`);
        a('- **运行过程**：');
        an.steps.forEach((s, k) => a(`  ${k + 1}. ${s}`));
        a(`- **教学重点**：${an.teachingTip}`);
        a(`- **调试提醒**：${an.debugTip}\n`);
        a('```scratch');
        a(an.source);
        a('```\n');
      });
    });

    a('---\n');
    a('_本报告由单文件网页离线生成：解压 sb3 → 解析 project.json → 建积木图 → 积木词典翻译 → 模板化讲解。不联网、不上传。_');
    return L.join('\n');
  }

  /* ---------- 主流程 ---------- */
  async function handleFile(file) {
    if (!file) return;
    if (!/\.sb3$/i.test(file.name)) {
      setState('文件类型不对', '请选择 Scratch 3.0 的 .sb3 文件（不是 .sb2 或 .sb 哦）。', true);
      return;
    }
    if (file.size > 200 * 1024 * 1024) {
      setState('文件太大', '超过 200MB，浏览器内存可能不够。建议先在 Scratch 里精简素材。', true);
      return;
    }

    setState('正在解析', `读取 ${file.name}（${kb(file.size)}）…`);
    await new Promise(r => setTimeout(r, 30));

    try {
      const { project } = await SB3.loadProject(file);
      setState('正在生成报告', `解压完成，正在分析 ${project.targets.length} 个对象…`);
      await new Promise(r => setTimeout(r, 30));

      const report = buildReport(project, { fileName: file.name, fileSize: file.size });
      render(report);
      clearState();
    } catch (e) {
      console.error(e);
      setState('解析失败', e && e.message ? e.message : String(e), true);
    }
  }

  function reset() {
    LAST = null;
    $('#report').innerHTML = '';
    $('#report').classList.remove('show');
    $('#landing').style.display = '';
    $('#btnReset').style.display = 'none';
    $('#btnPick').textContent = '选择文件';
    $('#file').value = '';
    clearState();
  }

  function init() {
    Blocks.init();
    const drop = $('#drop'), input = $('#file');
    $('#btnPick').onclick = () => input.click();
    $('#btnReset').onclick = reset;
    input.onchange = e => handleFile(e.target.files[0]);

    drop.onclick = () => input.click();
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation(); drop.classList.add('over');
    }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation(); drop.classList.remove('over');
    }));
    drop.addEventListener('drop', e => {
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      handleFile(f);
    });
    // 防止拖到页面其他位置时浏览器直接打开文件
    ['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => e.preventDefault()));

    if (typeof DecompressionStream === 'undefined') {
      $('#offlinePill').textContent = '浏览器不支持，请更新';
      $('#offlinePill').style.cssText = 'background:#fff4f5;border-color:#ffd4d9;color:#b4232f';
    }
  }

  return { init, handleFile, __render: render, __toMd: toMarkdown, __last: () => LAST };
})();

document.addEventListener('DOMContentLoaded', UI.init);

</script>
