
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fda4af'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23fde047' stroke='%235b3a22' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23fff9f7' stroke='%235b3a22' stroke-width='2'/%3E%3C/svg%3E">
    <title>奶油甜甜圈汉诺塔</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, "Microsoft Yahei", sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        html, body {
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        body {
            background: #ffdce2;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .main-wrap {
            width: 100%;
            max-width: 1700px;
            background: #fff9f7;
            border-radius: 28px;
            padding: 16px;
            box-shadow: 0 12px 32px rgba(255, 170, 180, 0.25);
            border: 4px solid #ffffff;
        }

        /* ===== 顶部控制栏 ===== */
        .header-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .clock-icon {
            width: 44px;
            height: 44px;
            min-width: 44px;
            border-radius: 999px;
            background: #ffe6cc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            box-shadow: 0 3px 8px rgba(240, 160, 100, 0.3);
        }

        .ctrl-group {
            display: flex;
            gap: 8px;
            background: #fff2ee;
            border-radius: 20px;
            padding: 8px 12px;
            flex: 1;
            align-items: center;
            flex-wrap: wrap;
            min-width: 0;
        }

        .ctrl-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: #704020;
        }

        .dot-yellow, .dot-pink, .dot-beige {
            width: 16px;
            height: 16px;
            border-radius: 999px;
            flex-shrink: 0;
        }
        .dot-yellow { background: #fde047; }
        .dot-pink { background: #fda4af; }
        .dot-beige { background: #fef0c7; }

        .ctrl-item input {
            width: 52px;
            border: none;
            background: #fff;
            border-radius: 10px;
            padding: 6px 4px;
            font-size: 16px;
            text-align: center;
            min-height: 44px;
        }

        .ctrl-item button {
            border: none;
            border-radius: 999px;
            padding: 8px 18px;
            font-size: 15px;
            color: #704020;
            cursor: pointer;
            transition: 0.2s;
            min-height: 44px;
            min-width: 56px;
            font-weight: 600;
        }

        #startBtn { background: #fef0c7; }
        #startBtn:active { background: #fde68a; transform: scale(0.96); }

        #resetBtn { background: #fda4af; color: #fff; }
        #resetBtn:active { background: #fb7185; transform: scale(0.96); }

        .stat-group {
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
            justify-content: center;
        }

        .step-box {
            background: #fff;
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 14px;
            color: #704020;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.08);
            font-weight: 600;
        }

        .time-box {
            background: #60a5fa;
            color: white;
            border-radius: 999px;
            padding: 7px 16px;
            font-size: 14px;
            box-shadow: 0 3px 8px rgba(96, 165, 250, 0.35);
            font-weight: 600;
        }

        /* ===== 柱子区域 ===== */
        .tower-area {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 20px 6px;
            min-height: 340px;
            touch-action: none;
        }

        .tower {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            width: 30%;
            max-width: 200px;
            position: relative;
            cursor: pointer;
            padding-bottom: 10px;
        }

        .tower.highlight {
            filter: drop-shadow(0 0 10px #ffb86c);
        }

        .tower-base {
            width: 100%;
            height: 50px;
            background: linear-gradient(180deg, #ffe2b0, #f9d098);
            border-radius: 999px;
            position: relative;
            box-shadow: 0 6px 12px rgba(180, 130, 80, 0.2);
        }

        .tower-base::before {
            content: "";
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 22px;
            background: #fff8ee;
            border-radius: 50%;
            clip-path: polygon(0% 40%, 10% 100%, 20% 40%, 35% 100%, 50% 40%, 65% 100%, 80% 40%, 90% 100%, 100% 40%);
        }

        .tower-pole {
            width: 32px;
            height: 200px;
            background: #f9cdb4;
            border-radius: 999px;
            position: absolute;
            bottom: 25px;
            z-index: 1;
            box-shadow: inset -5px 0 8px rgba(180, 120, 90, 0.15);
        }

        /* ===== 圆环 ===== */
        .ring {
            height: 30px;
            border-radius: 999px;
            z-index: 2;
            cursor: grab;
            position: relative;
            margin-bottom: 3px;
            transition: transform 0.2s ease, opacity 0.2s;
            border: 2px solid #5b3a22;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.22);
            touch-action: none;
        }

        .ring:active { cursor: grabbing; }

        .ring.dragging {
            z-index: 999;
            opacity: 0.85;
            transform: scale(1.08);
            transition: none;
        }

        .ring.selected {
            transform: translateY(-12px);
            opacity: 0.88;
        }

        /* 中间白点数字 */
        .ring-number {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            line-height: 20px;
            text-align: center;
            border-radius: 999px;
            background: #fff9f7;
            color: #5b3a22;
            font-weight: 800;
            font-size: 14px;
            z-index: 4;
            pointer-events: none;
            border: 2px solid #5b3a22;
        }

        .ring-pattern {
            position: absolute;
            left: 0; right: 0; top: 0; bottom: 0;
            border-radius: 999px;
            pointer-events: none;
            z-index: 3;
        }
        .ring-pattern.dots {
            background-image: radial-gradient(circle, rgba(255,255,255,0.85) 1.2px, transparent 1.8px);
            background-size: 7px 7px;
        }
        .ring-pattern.stripes {
            background-image: repeating-linear-gradient(90deg,
                rgba(255,255,255,0) 0,
                rgba(255,255,255,0) 5px,
                rgba(255,255,255,0.75) 5px,
                rgba(255,255,255,0.75) 8px);
        }
        .ring-pattern.arcs {
            background-image: radial-gradient(circle at 50% 45%,
                rgba(255,255,255,0) 10px,
                rgba(255,255,255,0.7) 10px,
                rgba(255,255,255,0.7) 13px,
                rgba(255,255,255,0) 13px);
        }
        .ring-pattern.squares {
            background-image:
                linear-gradient(45deg, rgba(255,255,255,0.7) 25%, rgba(255,255,255,0) 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.7) 25%, rgba(255,255,255,0) 25%);
            background-size: 10px 10px;
        }

        .tip {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #92400e;
            min-height: 22px;
            line-height: 1.5;
            padding: 0 4px;
        }

        /* ===== 平板及以上 ===== */
        @media (min-width: 600px) {
            body { padding: 20px; align-items: center; }
            .main-wrap { padding: 24px; border-radius: 36px; border-width: 6px; }
            .header-bar { gap: 16px; margin-bottom: 32px; }
            .clock-icon { width: 60px; height: 60px; font-size: 28px; }
            .ctrl-group { gap: 10px; border-radius: 999px; padding: 10px 16px; }
            .ctrl-item { font-size: 18px; gap: 6px; }
            .dot-yellow, .dot-pink, .dot-beige { width: 22px; height: 22px; }
            .ctrl-item input { width: 70px; font-size: 16px; padding: 6px 8px; }
            .ctrl-item button { padding: 8px 20px; font-size: 17px; min-height: 40px; }
            .stat-group { width: auto; margin-left: auto; }
            .step-box, .time-box { font-size: 18px; padding: 9px 20px; }
            .tower-area { gap: 40px; padding: 30px 20px; min-height: 440px; }
            .tower { width: 200px; max-width: none; padding-bottom: 20px; }
            .tower-base { height: 70px; }
            .tower-base::before { top: -12px; height: 26px; }
            .tower-pole { width: 48px; height: 260px; bottom: 35px; }
            .ring { height: 40px; margin-bottom: 5px; }
            .ring-number { width: 30px; height: 30px; line-height: 26px; font-size: 17px; }
            .tip { font-size: 17px; margin-top: 16px; }
        }

        @media (min-width: 1024px) {
            .tower-area { gap: 60px; min-height: 480px; }
            .tower { width: 240px; }
            .tower-base { height: 80px; }
            .tower-pole { width: 56px; height: 280px; bottom: 40px; }
            .ring { height: 46px; }
            .ring-number { width: 34px; height: 34px; line-height: 30px; font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="main-wrap">
    <div class="header-bar">
        <div class="clock-icon">⏱️</div>
        <div class="ctrl-group">
            <div class="ctrl-item">
                <span class="dot-yellow"></span>
                <label>圆环</label>
                <input id="ringCount" type="number" min="1" max="10" value="5">
            </div>
            <div class="ctrl-item">
                <span class="dot-pink"></span>
                <label>柱子</label>
                <input id="towerCount" type="number" min="3" max="8" value="3">
            </div>
            <div class="ctrl-item">
                <span class="dot-beige"></span>
                <button id="startBtn">开始</button>
            </div>
            <div class="ctrl-item">
                <span class="dot-pink"></span>
                <button id="resetBtn">重置</button>
            </div>
        </div>
        <div class="stat-group">
            <div class="step-box">步数 <span id="step">0</span></div>
            <div class="time-box"><span id="time">0</span>秒</div>
        </div>
    </div>

    <div class="tower-area" id="towerWrap"></div>

    <div class="tip" id="tip">
        点击圆环选中，或按住拖拽到目标柱子；只能移动最上方圆环，大环不能放小环上
    </div>
</div>

<script>
(function() {
    const towerWrap = document.getElementById('towerWrap');
    const ringCountInput = document.getElementById('ringCount');
    const towerCountInput = document.getElementById('towerCount');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const stepDom = document.getElementById('step');
    const timeDom = document.getElementById('time');
    const tipDom = document.getElementById('tip');

    let towers = [];
    let ringNum = 5;
    let towerNum = 3;
    let selectedRing = null;
    let selectedTowerIndex = null;
    let step = 0;
    let timer = null;
    let startTime = null;
    let gameStarted = false;

    // 拖拽状态
    let isDragging = false;
    let dragRingEl = null;
    let dragRingSize = null;
    let dragSourceTower = null;
    let hoverTowerIndex = -1;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let hasMoved = false;
    let touchStartTime = 0;
    let touchStartX = 0;
    let touchStartY = 0;

    const colorList = [
        '#ef4444', '#f59e0b', '#eab308', '#16a34a', '#2563eb',
        '#7c3aed', '#db2777', '#0891b2', '#b45309', '#4f46e5'
    ];
    const patternList = ['dots','stripes','arcs','squares','dots','stripes','arcs','squares','dots','stripes'];

    function getRingWidth(size) {
        // 根据屏幕宽度动态计算圆环宽度
        const areaWidth = towerWrap.clientWidth;
        const towerWidth = Math.min(areaWidth / towerNum - 16, 200);
        const minW = Math.min(60, towerWidth * 0.45);
        const maxW = Math.min(towerWidth * 0.95, 220);
        return minW + (size - 1) * ((maxW - minW) / Math.max(ringNum - 1, 1));
    }

    function renderTowers() {
        towerWrap.innerHTML = '';
        for (let t = 0; t < towerNum; t++) {
            const towerDiv = document.createElement('div');
            towerDiv.className = 'tower';
            towerDiv.dataset.index = t;

            const base = document.createElement('div');
            base.className = 'tower-base';
            towerDiv.appendChild(base);

            const pole = document.createElement('div');
            pole.className = 'tower-pole';
            towerDiv.appendChild(pole);

            towerWrap.appendChild(towerDiv);

            towers[t].forEach(r => {
                towerDiv.appendChild(createRing(r));
            });

            towerDiv.addEventListener('click', function(e) {
                if (hasMoved) return;
                towerClick(parseInt(this.dataset.index));
            });
        }
    }

    function createRing(size) {
        const r = document.createElement('div');
        r.className = 'ring';
        r.dataset.size = size;
        r.style.width = getRingWidth(size) + 'px';
        r.style.backgroundColor = colorList[(size - 1) % colorList.length];

        const num = document.createElement('div');
        num.className = 'ring-number';
        num.innerText = size;
        r.appendChild(num);

        const pat = document.createElement('div');
        pat.className = 'ring-pattern ' + patternList[(size - 1) % patternList.length];
        r.appendChild(pat);

        // 点击（短按）
        r.addEventListener('click', function(e) {
            e.stopPropagation();
            if (hasMoved) return;
            ringClick(this);
        });

        // 鼠标拖拽
        r.addEventListener('mousedown', function(e) {
            startDrag(e, this, e.clientX, e.clientY);
        });

        // 触摸拖拽
        r.addEventListener('touchstart', function(e) {
            const t = e.touches[0];
            startDrag(e, this, t.clientX, t.clientY);
        }, { passive: false });

        return r;
    }

    function startDrag(e, ringEl, clientX, clientY) {
        if (!gameStarted) return;
        const towerIdx = parseInt(ringEl.parentElement.dataset.index);
        const topRing = towers[towerIdx][towers[towerIdx].length - 1];
        const ringSize = parseInt(ringEl.dataset.size);

        if (topRing !== ringSize) {
            tipDom.innerText = '只能移动最上方的圆环';
            return;
        }

        e.preventDefault();
        const rect = ringEl.getBoundingClientRect();
        dragOffsetX = clientX - rect.left;
        dragOffsetY = clientY - rect.top;

        isDragging = true;
        hasMoved = false;
        dragRingEl = ringEl;
        dragRingSize = ringSize;
        dragSourceTower = towerIdx;
        touchStartTime = Date.now();
        touchStartX = clientX;
        touchStartY = clientY;

        ringEl.classList.add('dragging');
        ringEl.style.position = 'fixed';
        ringEl.style.left = (clientX - dragOffsetX) + 'px';
        ringEl.style.top = (clientY - dragOffsetY) + 'px';
        ringEl.style.zIndex = '999';

        tipDom.innerText = '拖动到目标柱子后松开';
    }

    function moveDrag(clientX, clientY) {
        if (!isDragging || !dragRingEl) return;

        // 判断是否真的移动了（区分点击和拖拽）
        const dx = clientX - touchStartX;
        const dy = clientY - touchStartY;
        if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
            hasMoved = true;
        }

        dragRingEl.style.left = (clientX - dragOffsetX) + 'px';
        dragRingEl.style.top = (clientY - dragOffsetY) + 'px';

        // 检测悬浮柱子
        hoverTowerIndex = -1;
        const towerList = document.querySelectorAll('.tower');
        towerList.forEach(tower => {
            tower.classList.remove('highlight');
            const rect = tower.getBoundingClientRect();
            if (clientX >= rect.left && clientX <= rect.right &&
                clientY >= rect.top && clientY <= rect.bottom) {
                hoverTowerIndex = parseInt(tower.dataset.index);
            }
        });
        if (hoverTowerIndex >= 0) {
            const t = document.querySelector('.tower[data-index="' + hoverTowerIndex + '"]');
            if (t) t.classList.add('highlight');
        }
    }

    function endDrag() {
        if (!isDragging) return;

        if (hasMoved && hoverTowerIndex >= 0 && dragSourceTower !== hoverTowerIndex) {
            const targetTop = towers[hoverTowerIndex][towers[hoverTowerIndex].length - 1];
            if (!targetTop || dragRingSize < targetTop) {
                towers[dragSourceTower].pop();
                towers[hoverTowerIndex].push(dragRingSize);
                step++;
                stepDom.innerText = step;
                tipDom.innerText = '放置成功，继续加油！';
                clearSelected();
                renderTowers();
                checkWin();
            } else {
                tipDom.innerText = '不能把大圆环放到小圆环上面！';
            }
        } else if (hasMoved) {
            tipDom.innerText = '已取消拖拽';
        }

        // 重置拖拽状态
        isDragging = false;
        if (dragRingEl) {
            dragRingEl.classList.remove('dragging');
            dragRingEl.style.position = '';
            dragRingEl.style.left = '';
            dragRingEl.style.top = '';
            dragRingEl.style.zIndex = '';
        }
        document.querySelectorAll('.tower').forEach(t => t.classList.remove('highlight'));
        dragRingEl = null;
        dragRingSize = null;
        dragSourceTower = null;
        hoverTowerIndex = -1;

        // 延迟重置 hasMoved，让 click 事件能读到
        setTimeout(function() { hasMoved = false; }, 50);
    }

    // 全局鼠标事件
    document.addEventListener('mousemove', function(e) {
        moveDrag(e.clientX, e.clientY);
    });
    document.addEventListener('mouseup', function() {
        endDrag();
    });

    // 全局触摸事件
    document.addEventListener('touchmove', function(e) {
        if (!isDragging) return;
        e.preventDefault();
        const t = e.touches[0];
        moveDrag(t.clientX, t.clientY);
    }, { passive: false });

    document.addEventListener('touchend', function(e) {
        if (!isDragging) return;
        e.preventDefault();
        endDrag();
    }, { passive: false });

    document.addEventListener('touchcancel', function() {
        endDrag();
    });

    // 窗口大小变化时重新渲染（适配横竖屏切换）
    let resizeTimer = null;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
            renderTowers();
        }, 200);
    });

    function ringClick(ringDom) {
        if (!gameStarted) return;
        const towerIdx = parseInt(ringDom.parentElement.dataset.index);
        const topRing = towers[towerIdx][towers[towerIdx].length - 1];
        const ringSize = parseInt(ringDom.dataset.size);

        if (topRing !== ringSize) {
            tipDom.innerText = '只能移动最上方的圆环';
            return;
        }

        clearSelected();
        ringDom.classList.add('selected');
        selectedRing = ringSize;
        selectedTowerIndex = towerIdx;
        tipDom.innerText = '已选中 ' + ringSize + ' 号，点击目标柱子移动';
    }

    function towerClick(targetTowerIdx) {
        if (!gameStarted) return;
        if (selectedRing === null) {
            tipDom.innerText = '先点击圆环选中，或直接拖拽';
            return;
        }
        if (selectedTowerIndex === targetTowerIdx) {
            clearSelected();
            tipDom.innerText = '已取消选择';
            return;
        }
        const targetTop = towers[targetTowerIdx][towers[targetTowerIdx].length - 1];
        if (targetTop && selectedRing > targetTop) {
            tipDom.innerText = '不能把大圆环放到小圆环上面！';
            clearSelected();
            return;
        }
        towers[selectedTowerIndex].pop();
        towers[targetTowerIdx].push(selectedRing);
        step++;
        stepDom.innerText = step;
        clearSelected();
        renderTowers();
        tipDom.innerText = '移动成功，当前步数：' + step;
        checkWin();
    }

    function checkWin() {
        if (towers[towerNum - 1].length === ringNum) {
            gameStarted = false;
            clearInterval(timer);
            tipDom.innerText = '通关！总步数 ' + step + '，用时 ' + Math.floor((Date.now() - startTime) / 1000) + ' 秒';
        }
    }

    function clearSelected() {
        document.querySelectorAll('.ring.selected').forEach(d => d.classList.remove('selected'));
        selectedRing = null;
        selectedTowerIndex = null;
    }

    function startGame() {
        ringNum = parseInt(ringCountInput.value);
        towerNum = parseInt(towerCountInput.value);
        if (isNaN(ringNum) || ringNum < 1 || ringNum > 10) {
            tipDom.innerText = '圆环数量范围 1~10';
            return;
        }
        if (isNaN(towerNum) || towerNum < 3 || towerNum > 8) {
            tipDom.innerText = '柱子数量范围 3~8';
            return;
        }
        towers = Array(towerNum).fill(null).map(() => []);
        for (let i = ringNum; i >= 1; i--) towers[0].push(i);

        step = 0;
        stepDom.innerText = 0;
        timeDom.innerText = 0;
        clearInterval(timer);
        gameStarted = true;
        startTime = Date.now();
        timer = setInterval(function() {
            timeDom.innerText = Math.floor((Date.now() - startTime) / 1000);
        }, 1000);

        renderTowers();
        tipDom.innerText = '开始！点击选中或拖拽圆环到目标柱子';
    }

    function resetGame() {
        clearInterval(timer);
        ringNum = parseInt(ringCountInput.value) || 5;
        towerNum = parseInt(towerCountInput.value) || 3;
        if (ringNum < 1) ringNum = 1;
        if (towerNum < 3) towerNum = 3;
        towers = Array(towerNum).fill(null).map(() => []);
        for (let i = ringNum; i >= 1; i--) towers[0].push(i);
        step = 0;
        stepDom.innerText = 0;
        timeDom.innerText = 0;
        gameStarted = false;
        clearSelected();
        renderTowers();
        tipDom.innerText = '已重置，点击开始游戏';
    }

    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', resetGame);

    // 初始化
    towers = Array(towerNum).fill(null).map(() => []);
    for (let i = ringNum; i >= 1; i--) towers[0].push(i);
    renderTowers();
})();
