<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻图 · 离线图片压缩工具</title>
<style>
  :root{
    --bg:#f6f8fb; --panel:#ffffff; --ink:#1f2933; --sub:#6b7785;
    --line:#e4e9f0; --brand:#3b82f6; --brand-d:#2563eb;
    --ok:#16a34a; --warn:#d97706; --danger:#dc2626; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px 48px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  header .logo{
    width:40px;height:40px;border-radius:11px;flex:0 0 auto;
    background:linear-gradient(135deg,#3b82f6,#22d3ee);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;
    box-shadow:0 6px 16px rgba(59,130,246,.3);
  }
  header h1{font-size:20px;margin:0}
  header p{margin:0;color:var(--sub);font-size:13px}
  .badge{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);
    background:#eafaf0;border:1px solid #cdeed8;padding:3px 9px;border-radius:999px;margin-left:auto;font-weight:600;
  }
  .badge svg{width:13px;height:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:18px}
  .drop{
    border:2px dashed #c3d0e0;border-radius:var(--radius);padding:34px 18px;text-align:center;
    background:#fbfdff;cursor:pointer;transition:.18s; color:var(--sub);
  }
  .drop:hover,.drop.over{border-color:var(--brand);background:#f0f7ff;color:var(--brand-d)}
  .drop strong{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}
  .drop .hint{font-size:13px}
  .settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:600}
  .field .row{display:flex;align-items:center;gap:10px}
  select,input[type=range]{width:100%}
  select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:14px}
  input[type=range]{accent-color:var(--brand)}
  .val{font-variant-numeric:tabular-nums;min-width:46px;text-align:right;font-size:13px;color:var(--ink);font-weight:600}
  .list{margin-top:8px;display:flex;flex-direction:column;gap:10px}
  .item{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .item .thumb{width:64px;height:64px;border-radius:9px;object-fit:cover;background:#eef2f7;flex:0 0 auto;border:1px solid var(--line)}
  .item .meta{flex:1;min-width:0}
  .item .name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .stats{font-size:12.5px;color:var(--sub);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .item .stats b{color:var(--ink);font-variant-numeric:tabular-nums}
  .pill{font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:700}
  .pill.ok{background:#eafaf0;color:var(--ok)}
  .pill.up{background:#fdecec;color:var(--danger)}
  .pill.wait{background:#eef2f7;color:var(--sub)}
  .item .acts{display:flex;gap:8px;flex:0 0 auto}
  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:9px;font-size:13px;font-weight:600;
    padding:8px 13px;transition:.15s;
  }
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-d)}
  .btn-ghost{background:#eef2f7;color:var(--ink)}
  .btn-ghost:hover{background:#e2e8f0}
  .btn-danger{background:#fdecec;color:var(--danger)}
  .btn-danger:hover{background:#f9d6d6}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
  .toolbar .summary{margin-left:auto;color:var(--sub);font-size:13px}
  .toolbar .summary b{color:var(--ok);font-variant-numeric:tabular-nums}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:8px}
  .foot{margin-top:22px;font-size:12px;color:var(--sub);text-align:center;line-height:1.7}
  .foot code{background:#eef2f7;padding:1px 6px;border-radius:6px;font-size:12px}
  @media(max-width:520px){
    .item .acts{flex-direction:column}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">轻</div>
    <div>
      <h1>轻图</h1>
      <p>本地离线 · 隐私安全的图片压缩工具</p>
    </div>
    <span class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-4z"/></svg>
      全部在本机处理
    </span>
  </header>

  <div class="card">
    <div id="drop" class="drop" tabindex="0">
      <strong>拖拽图片到这里，或点击选择</strong>
      <span class="hint">支持 JPG / PNG / WebP，可一次选择多张 · 图片绝不会上传到任何服务器</span>
      <input id="file" type="file" accept="image/*" multiple hidden>
    </div>

    <div class="card" style="margin-top:18px;padding:16px">
      <div class="settings">
        <div class="field">
          <label>压缩质量</label>
          <div class="row">
            <input id="quality" type="range" min="10" max="100" value="80">
            <span class="val" id="qualityVal">80</span>
          </div>
        </div>
        <div class="field">
          <label>最长边限制（像素）</label>
          <select id="maxDim">
            <option value="0">不限制（保持原尺寸）</option>
            <option value="4096">4096（超大图缩放）</option>
            <option value="2560">2560</option>
            <option value="1920">1920（高清）</option>
            <option value="1280">1280（网页）</option>
            <option value="800">800（社交分享）</option>
          </select>
        </div>
        <div class="field">
          <label>输出格式</label>
          <select id="format">
            <option value="keep">保持原格式</option>
            <option value="image/jpeg">JPG（更小体积）</option>
            <option value="image/png">PNG（无损）</option>
            <option value="image/webp">WebP（高效压缩）</option>
          </select>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn-ghost" id="clearBtn">清空列表</button>
      <button class="btn-primary" id="zipBtn" disabled>打包下载全部（ZIP）</button>
      <span class="summary" id="summary"></span>
    </div>

    <div class="list" id="list">
      <div class="empty" id="empty">还没有图片，先添加几张吧～</div>
    </div>
  </div>

  <div class="foot">
    本工具为单文件离线应用：双击 HTML 即可在浏览器中运行，无需联网、无需安装。<br>
    所有压缩均在你的设备本地通过 <code>Canvas</code> 完成，图片不会离开本机，符合隐私安全要求。
  </div>
</div>

<script>
(function(){
  "use strict";
  const $ = (s)=>document.querySelector(s);
  const drop = $('#drop'), fileInput = $('#file'), list = $('#list'), empty = $('#empty');
  const qualityEl = $('#quality'), qualityVal = $('#qualityVal');
  const maxDimEl = $('#maxDim'), formatEl = $('#format');
  const zipBtn = $('#zipBtn'), clearBtn = $('#clearBtn'), summary = $('#summary');

  let items = [];   // {id, file, name, url, origSize, blob, compSize, done, failed}
  let seq = 0;

  qualityEl.addEventListener('input', ()=>{ qualityVal.textContent = qualityEl.value; items.forEach(recompress); });
  maxDimEl.addEventListener('change', ()=> items.forEach(recompress));
  formatEl.addEventListener('change', ()=> items.forEach(recompress));

  drop.addEventListener('click', ()=> fileInput.click());
  drop.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();fileInput.click();} });
  fileInput.addEventListener('change', e=>{ addFiles(e.target.files); fileInput.value=''; });
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop', e=>{ if(e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });
  // 支持页面任意位置拖入
  ['dragover','drop'].forEach(ev=>window.addEventListener(ev, e=>{
    if(ev==='drop' && e.target.closest && e.target.closest('#drop')) return;
    e.preventDefault();
  }));

  clearBtn.addEventListener('click', ()=>{ items.forEach(it=>{ if(it.url) URL.revokeObjectURL(it.url); }); items=[]; render(); });
  zipBtn.addEventListener('click', downloadAll);

  function fmtBytes(n){
    if(n<1024) return n+' B';
    if(n<1048576) return (n/1024).toFixed(1)+' KB';
    return (n/1048576).toFixed(2)+' MB';
  }
  function outExt(type){
    if(type==='image/jpeg') return 'jpg';
    if(type==='image/png') return 'png';
    if(type==='image/webp') return 'webp';
    return 'img';
  }
  function outType(fileType){
    const f = formatEl.value;
    if(f==='keep') return fileType;
    return f;
  }

  function addFiles(fileList){
    const arr = Array.from(fileList).filter(f=>f.type.startsWith('image/'));
    if(!arr.length) return;
    arr.forEach(file=>{
      const id = ++seq;
      const url = URL.createObjectURL(file);
      const it = {id, file, name:file.name, url, origSize:file.size, blob:null, compSize:0, done:false, failed:false};
      items.push(it);
      compress(it);
    });
    render();
  }

  function recompress(it){
    if(!it) return;
    it.done=false; it.failed=false; it.blob=null;
    updateItem(it);
    compress(it);
  }

  function compress(it){
    const img = new Image();
    img.onload = ()=>{
      try{
        let w = img.naturalWidth, h = img.naturalHeight;
        const maxDim = parseInt(maxDimEl.value,10);
        if(maxDim>0 && Math.max(w,h)>maxDim){
          const s = maxDim/Math.max(w,h);
          w = Math.max(1,Math.round(w*s));
          h = Math.max(1,Math.round(h*s));
        }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx = canvas.getContext('2d');
        const t = outType(it.file.type);
        if(t==='image/jpeg'){ ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h); }
        ctx.drawImage(img,0,0,w,h);
        const q = parseInt(qualityEl.value,10)/100;
        canvas.toBlob(blob=>{
          if(!blob){ it.failed=true; updateItem(it); return; }
          if(it.blobUrl) URL.revokeObjectURL(it.blobUrl);
          it.blob=blob; it.compSize=blob.size; it.done=true; it.failed=false;
          it.blobUrl=URL.createObjectURL(blob);
          updateItem(it);
        }, t, q);
      }catch(err){ it.failed=true; updateItem(it); }
    };
    img.onerror = ()=>{ it.failed=true; updateItem(it); };
    img.src = it.url;
  }

  function render(){
    empty.style.display = items.length ? 'none':'block';
    list.querySelectorAll('.item').forEach(n=>n.remove());
    items.forEach(it=>{
      const el = document.createElement('div');
      el.className='item'; el.dataset.id=it.id;
      el.innerHTML = `
        <img class="thumb" src="${it.url}" alt="">
        <div class="meta">
          <div class="name">${escapeHtml(it.name)}</div>
          <div class="stats">
            <span>原始 <b>${fmtBytes(it.origSize)}</b></span>
            <span class="cs">压缩 <b>—</b></span>
            <span class="ratio"></span>
            <span class="pill wait">处理中</span>
          </div>
        </div>
        <div class="acts">
          <button class="btn-primary dl">下载</button>
          <button class="btn-danger rm">移除</button>
        </div>`;
      el.querySelector('.dl').addEventListener('click', ()=>downloadOne(it));
      el.querySelector('.rm').addEventListener('click', ()=>removeOne(it));
      list.appendChild(el);
      updateItem(it);
    });
    updateSummary();
  }

  function updateItem(it){
    const el = list.querySelector('.item[data-id="'+it.id+'"]');
    if(!el) return;
    const cs = el.querySelector('.cs b');
    const ratio = el.querySelector('.ratio');
    const pill = el.querySelector('.pill');
    if(it.failed){ cs.textContent='失败'; pill.className='pill up'; pill.textContent='无法处理'; ratio.textContent=''; return; }
    if(!it.done){ cs.textContent='—'; pill.className='pill wait'; pill.textContent='处理中'; ratio.textContent=''; return; }
    cs.textContent = fmtBytes(it.compSize);
    const r = (1 - it.compSize/it.origSize)*100;
    if(r>=0){ pill.className='pill ok'; pill.textContent='↓ '+r.toFixed(0)+'%'; ratio.innerHTML='体积 <b>'+fmtBytes(it.origSize-it.compSize)+'</b>'; }
    else { pill.className='pill up'; pill.textContent='↑ '+Math.abs(r).toFixed(0)+'%'; ratio.innerHTML='体积 <b>+'+fmtBytes(it.compSize-it.origSize)+'</b>'; }
    updateSummary();
  }

  function updateSummary(){
    const done = items.filter(i=>i.done && i.blob);
    const totalOrig = done.reduce((s,i)=>s+i.origSize,0);
    const totalComp = done.reduce((s,i)=>s+i.compSize,0);
    const saved = totalOrig-totalComp;
    const pct = totalOrig? (saved/totalOrig*100):0;
    zipBtn.disabled = done.length===0;
    summary.innerHTML = done.length
      ? `${done.length} 张已完成 · 共节省 <b>${fmtBytes(saved)}</b>（${pct.toFixed(0)}%）`
      : '';
  }

  function removeOne(it){
    if(it.url) URL.revokeObjectURL(it.url);
    if(it.blobUrl) URL.revokeObjectURL(it.blobUrl);
    items = items.filter(x=>x!==it);
    render();
  }

  function downloadOne(it){
    if(!it.blob) return;
    const t = outType(it.file.type);
    const ext = outExt(t);
    const base = it.name.replace(/\.[^.]+$/,'');
    triggerDownload(it.blobUrl, `${base}.${ext}`);
  }

  function downloadAll(){
    const done = items.filter(i=>i.done && i.blob);
    if(!done.length) return;
    const entries = [];
    const reader = new FileReader();
    let i=0;
    const next = ()=>{
      if(i>=done.length){ const zip = buildZip(entries); triggerDownload(URL.createObjectURL(zip), '轻图-压缩包.zip'); return; }
      const it = done[i++];
      const t = outType(it.file.type); const ext = outExt(t);
      const base = it.name.replace(/\.[^.]+$/,'');
      const fr = new FileReader();
      fr.onload = ()=>{ entries.push({name:`${base}.${ext}`, data:new Uint8Array(fr.result)}); next(); };
      fr.readAsArrayBuffer(it.blob);
    };
    next();
  }

  function triggerDownload(href, filename){
    const a=document.createElement('a'); a.href=href; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  /* ---------- 纯 JS 实现的 ZIP（仅存储，无压缩，零依赖、可离线） ---------- */
  const crcTable = (function(){
    const t=new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++){ c = (c&1)?(0xEDB88320 ^ (c>>>1)):(c>>>1); } t[n]=c>>>0; }
    return t;
  })();
  function crc32(buf){
    let c=0xFFFFFFFF;
    for(let i=0;i<buf.length;i++){ c = crcTable[(c ^ buf[i]) & 0xFF] ^ (c>>>8); }
    return (c ^ 0xFFFFFFFF)>>>0;
  }
  function buildZip(entries){
    const enc=new TextEncoder();
    const chunks=[]; const central=[];
    let offset=0;
    entries.forEach(e=>{
      const nameBytes=enc.encode(e.name);
      const data=e.data;
      const crc=crc32(data);
      const lh=new Uint8Array(30+nameBytes.length);
      const dv=new DataView(lh.buffer);
      dv.setUint32(0,0x04034b50,true);
      dv.setUint16(4,20,true);
      dv.setUint16(6,0x0800,true);   // UTF-8 文件名
      dv.setUint16(8,0,true);        // store
      dv.setUint16(10,0,true);       // time
      dv.setUint16(12,0x21,true);    // date 1980-01-01
      dv.setUint32(14,crc,true);
      dv.setUint32(18,data.length,true);
      dv.setUint32(22,data.length,true);
      dv.setUint16(26,nameBytes.length,true);
      dv.setUint16(28,0,true);
      lh.set(nameBytes,30);
      chunks.push(lh,data);

      const ch=new Uint8Array(46+nameBytes.length);
      const cv=new DataView(ch.buffer);
      cv.setUint32(0,0x02014b50,true);
      cv.setUint16(4,20,true);
      cv.setUint16(6,20,true);
      cv.setUint16(8,0x0800,true);
      cv.setUint16(10,0,true);
      cv.setUint16(12,0,true);
      cv.setUint16(14,0x21,true);
      cv.setUint32(16,crc,true);
      cv.setUint32(20,data.length,true);
      cv.setUint32(24,data.length,true);
      cv.setUint16(28,nameBytes.length,true);
      cv.setUint16(30,0,true);
      cv.setUint16(32,0,true);
      cv.setUint16(34,0,true);
      cv.setUint16(36,0,true);
      cv.setUint32(38,0,true);
      cv.setUint32(42,offset,true);
      ch.set(nameBytes,46);
      central.push(ch);

      offset += lh.length + data.length;
    });
    const cdSize=central.reduce((s,c)=>s+c.length,0);
    const cdOffset=offset;
    const eo=new Uint8Array(22);
    const ev=new DataView(eo.buffer);
    ev.setUint32(0,0x06054b50,true);
    ev.setUint16(4,0,true);
    ev.setUint16(6,0,true);
    ev.setUint16(8,entries.length,true);
    ev.setUint16(10,entries.length,true);
    ev.setUint32(12,cdSize,true);
    ev.setUint32(16,cdOffset,true);
    ev.setUint16(20,0,true);
    return new Blob([...chunks,...central,eo],{type:'application/zip'});
  }
})();
</script>
</body>
</html>
